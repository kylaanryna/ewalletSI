<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMART</title>
  <link rel="icon" type="image/png" href="assets/simart-logo.png" /> 
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --bg: #fce9ab;
      --surface: #fff7dc;
      --ink: #7d1028;
      --ink2: #9e3146;
      --muted: #9f6a2b;
      --line: rgba(196, 43, 52, 0.18);
      --line-soft: rgba(252, 143, 45, 0.14);
      --mint: #9f9820;
      --mint-tint: #ece8b8;
      --gold: #fc8f2d;
      --gold-tint: #ffe1b6;
      --orange: #dc417c;
      --orange-tint: #f9c6d7;
      --ink-tint: #f5d6d9;
      --danger: #c42b34;
      --shadow: 0 24px 60px -36px rgba(120, 26, 41, 0.36);
      --blush: #dc417c;
      --tomato: #c42b34;
      --vanilla: #fce9ab;
      --princeton: #fc8f2d;
      --olive: #9f9820;
      --radius: 28px;
      --radius-lg: 36px;
      --radius-md: 22px;
      --radius-sm: 16px;
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    input, select {
      outline: none;
    }
    .app-shell {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(220, 65, 124, 0.28), transparent 34%),
        radial-gradient(circle at bottom right, rgba(159, 152, 32, 0.2), transparent 30%),
        var(--bg);
    }
    .bg-orb {
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(110px);
      opacity: 0.55;
    }
    .orb-a {
      width: 420px;
      height: 420px;
      top: -130px;
      left: -140px;
      background: rgba(220, 65, 124, 0.34);
      animation: floatOrb 18s ease-in-out infinite alternate;
    }
    .orb-b {
      width: 380px;
      height: 380px;
      bottom: -150px;
      right: -90px;
      background: rgba(159, 152, 32, 0.24);
      animation: floatOrb 20s ease-in-out infinite alternate-reverse;
    }
    @keyframes floatOrb {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(8px, -8px, 0) scale(1.02); }
    }
    .root {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }
    .login-wrap,
    .main-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card-shell {
      width: 100%;
      max-width: 1180px;
      border-radius: 34px;
      overflow: hidden;
      background: rgba(255, 247, 220, 0.82);
      border: 1px solid rgba(196, 43, 52, 0.14);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      animation: none;
    }
    .login-grid {
      display: grid;
      grid-template-columns: 1.14fr 0.86fr;
      min-height: 680px;
    }
    .hero {
      padding: 42px 44px 36px;
      background: linear-gradient(135deg, #d63d6a 0%, #c72c4f 24%, #d65d56 52%, #e9844a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      animation: none;
    }
    .hero::after {
      content: "";
      position: absolute;
      right: -70px;
      bottom: -90px;
      width: 320px;
      height: 320px;
      border-radius: 999px;
      background: rgba(255, 247, 220, 0.10);
      filter: blur(8px);
      pointer-events: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 20px;
      line-height: 1;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(24, 26, 20, 0.08);
      flex: 0 0 auto;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .profile-avatar {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      object-fit: contain;
      background: #fff;
      padding: 2px;
      box-sizing: border-box;
      box-shadow: 0 0 0 1px rgba(24, 26, 20, 0.08);
      display: block;
      flex: 0 0 auto;
    }
    h1, h2, h3, p { margin: 0; }
    .hero h1 {
      margin-top: 34px;
      font-size: clamp(2.4rem, 4vw, 4.1rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
      position: relative;
      z-index: 1;
      max-width: 420px;
      color: #fffaf0;
    }
    .hero p.lead {
      margin-top: 18px;
      max-width: 460px;
      color: rgba(255, 247, 220, 0.9);
      font-size: 15px;
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }
    .hero-badges {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 247, 220, 0.14);
      border: 1px solid rgba(255, 247, 220, 0.20);
      box-shadow: 0 12px 24px -18px rgba(120, 26, 41, 0.45);
      color: #fff7dc;
      font-weight: 700;
      font-size: 13px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      backdrop-filter: blur(2px);
    }
    .badge:hover { transform: translateY(-1px); box-shadow: 0 14px 22px -20px rgba(24, 26, 20, 0.5); }
    .badge small { display: block; color: rgba(255, 247, 220, 0.78); font-weight: 600; font-size: 11px; margin-top: 2px; }
    .login-form {
      padding: 54px 56px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(180deg, #f8f2dd 0%, #f4ead1 100%);
    }
    .title {
      font-size: clamp(2.2rem, 3vw, 3rem);
      letter-spacing: -0.06em;
      line-height: 1.05;
      color: var(--ink);
      font-weight: 800;
    }
    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }
    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink2);
    }
    .input-shell, .select-shell {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 16px;
      border-radius: 18px;
      background: rgba(252, 233, 171, 0.42);
      border: 1.5px solid rgba(196, 43, 52, 0.12);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }
    .input-shell:focus-within {
      border-color: rgba(196, 43, 52, 0.26);
      box-shadow: 0 0 0 3px rgba(196, 43, 52, 0.07);
    }
    .input-shell input, .select-shell select {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
    }
    .input-icon {
      width: 18px;
      color: var(--muted);
      flex: 0 0 auto;
      text-align: center;
      font-size: 14px;
    }
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 15px 18px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.14s ease, opacity 0.14s ease, box-shadow 0.14s ease;
      text-decoration: none;
      white-space: nowrap;
      will-change: transform;
      font-size: 15px;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: scale(0.99) translateY(0); }
    .btn-dark { background: linear-gradient(135deg, #c94062, #b81e44); color: white; box-shadow: 0 16px 26px -18px rgba(196, 43, 52, 0.82); }
    .btn-mint { background: linear-gradient(135deg, #b9bd4f, #9b9b20); color: white; box-shadow: 0 16px 26px -18px rgba(159, 152, 32, 0.82); }
    .btn-orange { background: linear-gradient(135deg, #f7b15d, #ea8d39); color: white; box-shadow: 0 16px 26px -18px rgba(252, 143, 45, 0.82); }
    .btn-ghost { background: transparent; color: var(--ink2); border: 1px solid var(--line); }
    .helper {
      margin-top: 8px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .sidebar {
      width: 280px;
      flex: 0 0 auto;
      background: linear-gradient(180deg, #fff9e4 0%, #ffe8bd 100%);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 20px;
      min-height: 100vh;
    }
    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 26px;
    }
    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 13px 14px;
      border-radius: 18px;
      color: var(--ink2);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .nav-btn.active {
      background: var(--tomato);
      color: #fff;
      box-shadow: 0 14px 24px -20px rgba(196, 43, 52, 0.72);
    }
    .nav-btn {
      transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }
    .nav-btn:hover {
      transform: translateX(3px);
    }
    .nav-pill {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.8;
      flex: 0 0 auto;
    }
    .main {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-scroll {
      flex: 1 1 auto;
      padding: 30px 24px 24px;
      overflow: auto;
    }
    .panel {
      background: rgba(255, 250, 236, 0.84);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: 0 18px 40px -32px rgba(120, 26, 41, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      animation: none;
    }
    .panel:hover,
    .quick-card:hover,
    .student-card:hover,
    .product:hover,
    .history-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 28px -22px rgba(24, 26, 20, 0.28);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .page-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .scan-panel {
      padding: clamp(20px, 2.6vw, 34px);
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, #fffaf0 0%, #fff1d4 100%);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .scan-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(47, 158, 99, 0.12);
      border: 1px solid rgba(47, 158, 99, 0.28);
      color: #22744b;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .status-pill .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2f9e63;
      box-shadow: 0 0 0 3px rgba(47, 158, 99, 0.18);
      animation: ledBlink 1.8s ease-in-out infinite;
    }
    .status-pill.fail {
      background: rgba(196, 43, 52, 0.09);
      border-color: rgba(196, 43, 52, 0.3);
      color: var(--danger);
    }
    .status-pill.fail .status-dot {
      background: var(--danger);
      box-shadow: 0 0 0 3px rgba(196, 43, 52, 0.16);
    }
    @keyframes ledBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.96); }
    }
    .scan-title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(1.5rem, 2vw, 2rem);
      letter-spacing: -0.04em;
      line-height: 1.15;
      font-weight: 800;
    }
    .scan-subtitle {
      margin: 8px 0 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.65;
    }
    .scan-stage {
      position: relative;
      margin-top: 20px;
      display: grid;
      place-items: center;
      gap: 14px;
      padding: clamp(24px, 3.4vw, 40px) 20px;
      border-radius: var(--radius-md);
      background:
        radial-gradient(circle at 18% 12%, rgba(252, 143, 45, 0.16), transparent 46%),
        radial-gradient(circle at 84% 88%, rgba(220, 65, 124, 0.14), transparent 46%),
        linear-gradient(160deg, #ffeccd 0%, #ffe3f0 100%);
      border: 2px dashed rgba(196, 43, 52, 0.26);
      overflow: hidden;
      transition: border-color 0.25s ease;
    }
    .scan-stage.is-fail {
      border-color: rgba(196, 43, 52, 0.45);
      background:
        radial-gradient(circle at 18% 12%, rgba(196, 43, 52, 0.1), transparent 46%),
        radial-gradient(circle at 84% 88%, rgba(196, 43, 52, 0.12), transparent 46%),
        linear-gradient(160deg, #ffe4e2 0%, #ffd6dc 100%);
    }
    .stage-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120px;
      height: 120px;
      margin: -60px 0 0 -60px;
      border-radius: 999px;
      border: 2px solid rgba(199, 44, 79, 0.35);
      opacity: 0;
      pointer-events: none;
    }
    .scan-stage.is-scanning .stage-ring {
      animation: ringOut 1.6s ease-out infinite;
    }
    .scan-stage.is-scanning .stage-ring.r2 {
      animation-delay: 0.8s;
    }
    @keyframes ringOut {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    @keyframes stageSweep {
      0% { transform: translateY(-70px); }
      50% { transform: translateY(70px); }
      100% { transform: translateY(-70px); }
    }
    .scan-card-art {
      position: relative;
      z-index: 1;
      width: min(300px, 78%);
      aspect-ratio: 1.586;
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(135deg, #d63d6a 0%, #c72c4f 45%, #e9844a 100%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 24px 40px -26px rgba(125, 16, 40, 0.55);
      color: #fff7dc;
      transition: transform 0.25s ease;
    }
    .scan-stage.is-scanning .scan-card-art {
      animation: cardFloat 1.6s ease-in-out infinite;
    }
    .scan-stage.is-fail .scan-card-art {
      filter: saturate(0.75);
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .art-chip {
      width: 38px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #ffe1b6, #fc8f2d);
      box-shadow: inset 0 0 0 1px rgba(125, 16, 40, 0.28);
    }
    .art-waves {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }
    .art-waves i {
      width: 5px;
      border-radius: 999px;
      background: rgba(255, 247, 220, 0.85);
    }
    .art-waves i:nth-child(1) { height: 10px; opacity: 0.5; }
    .art-waves i:nth-child(2) { height: 16px; opacity: 0.75; }
    .art-waves i:nth-child(3) { height: 22px; }
    .art-num {
      position: absolute;
      left: 18px;
      bottom: 15px;
      font-weight: 800;
      letter-spacing: 0.22em;
      font-size: 0.92rem;
    }
    .stage-line {
      position: absolute;
      z-index: 2;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(199, 44, 79, 0.55), transparent);
      opacity: 0;
      pointer-events: none;
    }
    .scan-stage.is-scanning .stage-line {
      opacity: 1;
      animation: stageSweep 1.4s ease-in-out infinite;
    }
    .stage-hint {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--ink2);
      background: rgba(255, 250, 236, 0.72);
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(196, 43, 52, 0.14);
      backdrop-filter: blur(2px);
    }
    .scan-stage.is-fail .stage-hint {
      color: var(--danger);
      border-color: rgba(196, 43, 52, 0.3);
    }
    .scan-form {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }
    .field-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink2);
    }
    .rfid-reader {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 8px 14px;
      border-radius: 999px;
      border: 2px solid var(--line);
      background: #fffbf1;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .rfid-reader:focus-within {
      border-color: rgba(199, 44, 79, 0.55);
      box-shadow: 0 0 0 4px rgba(199, 44, 79, 0.1);
    }
    .rfid-reader.is-scanning {
      border-color: rgba(252, 143, 45, 0.65);
      box-shadow: 0 0 0 4px rgba(252, 143, 45, 0.14);
    }
    .scan-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(220, 65, 124, 0.1);
      color: #c72c4f;
      font-weight: 800;
      font-size: 0.95rem;
      flex: 0 0 auto;
      box-shadow: inset 0 0 0 1px rgba(199, 44, 79, 0.22);
    }
    .rfid-reader.is-scanning .scan-icon {
      animation: scanPulse 1s ease-in-out infinite;
    }
    .rfid-reader input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 10px 6px;
    }
    .rfid-reader input::placeholder {
      color: rgba(159, 106, 43, 0.55);
      font-weight: 500;
    }
    @keyframes scanPulse {
      0% { transform: scale(1); box-shadow: inset 0 0 0 1px rgba(199,44,79,.22), 0 0 0 0 rgba(199, 44, 79, 0.3); }
      70% { transform: scale(1.06); box-shadow: inset 0 0 0 1px rgba(199,44,79,.22), 0 0 0 10px rgba(199, 44, 79, 0); }
      100% { transform: scale(1); box-shadow: inset 0 0 0 1px rgba(199,44,79,.22), 0 0 0 0 rgba(199, 44, 79, 0); }
    }
    .scan-actions {
      margin-top: 6px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: stretch;
    }
    .scan-actions .btn {
      flex: 1;
    }
    .scan-note {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
    }
    .demo-chip {
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(159, 152, 32, 0.12);
      border: 1px solid rgba(159, 152, 32, 0.3);
      color: #6f6c14;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .selected-student-box {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      background: rgba(47, 158, 99, 0.1);
      border: 1px solid rgba(47, 158, 99, 0.28);
      color: var(--ink);
    }
    .selected-student-box .student-box-label {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #22744b;
    }
    .selected-student-box strong {
      font-size: 1rem;
    }
    .product-panel {
      padding: 20px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 249, 240, 0.98), rgba(255, 247, 220, 0.95));
      border: 1px solid rgba(196, 43, 52, 0.12);
      box-shadow: 0 12px 28px -18px rgba(97, 44, 31, 0.28);
    }
    .product-panel .section-title {
      margin: 0 0 16px;
      font-size: clamp(1.3rem, 1.6vw, 1.8rem);
      letter-spacing: -0.04em;
      line-height: 1.1;
      color: var(--ink);

    .product-modal-backdrop {

    }

    function todayLabel() {
      return new Date().toLocaleDateString("id-ID", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    }

    function isSameLocalDay(ts) {
      const d = new Date(ts);
      const now = new Date();
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    }

    function historyIsToday(h) {
      if (h.createdAt) return isSameLocalDay(h.createdAt);
      return h.date === todayLabel();
    }

    function currentAccount() {
      const key = String(state.loginUsername || "").trim().toLowerCase();
      return ACCOUNTS[key] || { role: state.role || "kasir", label: roleLabel() };

    function cashierDashboard() {
      const localToday = visibleHistory().filter((h) => historyIsToday(h) && h.type !== "topup");
      const localOmzet = localToday.reduce((s, h) => s + Number(h.amount || 0), 0);
      const apiToday = state.dashboardApi && state.dashboardApi.today;
      const transaksi = Math.max(localToday.length, apiToday ? Number(apiToday.transaksi || 0) : 0);
      const omzet = Math.max(localOmzet, apiToday ? Number(apiToday.omzet || 0) : 0);
      const avg = transaksi ? Math.round(omzet / transaksi) : 0;
      const itemsSold = localToday.reduce((s, h) => s + (h.items || []).reduce((n, it) => n + Number(it.qty || 0), 0), 0);
      const cartQty = Object.values(state.cart).reduce((s, q) => s + q, 0);
      const recent = (visibleHistory().length ? visibleHistory() : ((state.dashboardApi && state.dashboardApi.recent) || [])).slice(0, 6);
      const productMap = {};
      state.history.forEach((h) => {
        (h.items || []).forEach((it) => {
          const key = it.name || "Produk";
          if (!productMap[key]) productMap[key] = { name: key, emoji: it.emoji || "📦", qty: 0, amount: 0 };
          productMap[key].qty += Number(it.qty || 0);
          productMap[key].amount += Number(it.price || 0) * Number(it.qty || 0);
        });
      });
      const topProducts = Object.values(productMap).sort((a, b) => b.qty - a.qty).slice(0, 5);
      return { transaksi, omzet, avg, itemsSold, cartQty, recent, topProducts };
    }

    function adminDashboard() {
      const localToday = state.history.filter(historyIsToday);
      const localTopup = localToday.filter((h) => h.type === "topup");
      const localTopupTotal = localTopup.reduce((s, h) => s + Number(h.amount || 0), 0);
      const apiTop = state.dashboardApi && state.dashboardApi.topupToday;
      const topupCount = Math.max(localTopup.length, apiTop ? Number(apiTop.count || 0) : 0);
      const topupTotal = Math.max(localTopupTotal, apiTop ? Number(apiTop.total || 0) : 0);
      const totalSaldo = state.students.reduce((s, st) => s + Number(st.saldo || 0), 0);
      const recent = visibleHistory().slice(0, 6);
      return { topupCount, topupTotal, totalSaldo, recent };

      const map = {};
      state.products.forEach(p => {
        const key = catKey(p.cat) || "umum";
        if (!map[key]) map[key] = [];

      });
      const order = [...CATEGORIES.map(c => c.key), "umum"];
      return Object.keys(map)
        .sort((a, b) => order.indexOf(a) - order.indexOf(b))
        .map(key => ({ key, items: map[key] }));
    }

    function applyCatalogFilter(listId) {
      const isProduct = listId === "productLists";
      const input = document.getElementById(isProduct ? "productSearch" : "paymentSearch");
      const q = ((input && input.value) || "").trim().toLowerCase();
      const activeCat = isProduct ? state.productCat : state.paymentCat;
      const list = document.getElementById(listId);
      if (!list) return 0;
      let visible = 0;
      list.querySelectorAll(".catalog-group").forEach(group => {
        let n = 0;
        group.querySelectorAll(".product").forEach(card => {
          const name = (card.dataset.name || "").toLowerCase();
          const c = (card.dataset.cat || "").toLowerCase();
          const ok = (!q || name.includes(q)) && (activeCat === "all" || c === activeCat);
          card.style.display = ok ? "" : "none";
          if (ok) n++;
        });
        group.style.display = n > 0 ? "" : "none";
        const countEl = group.querySelector(".cat-count");
        if (countEl) countEl.textContent = n + " produk";
        visible += n;
      });
      const empty = document.getElementById(listId === "productLists" ? "productListsEmpty" : "paymentListsEmpty");
      if (empty) empty.style.display = visible > 0 ? "none" : "";
      return visible;
    }

    function showSweetAlert(message, type = "success", title = "Berhasil") {
      if (!window.Swal) return;

      const colorMap = {
        success: { icon: "success", title: "Berhasil" },
        error: { icon: "error", title: "Gagal" },
        warning: { icon: "warning", title: "Perhatian" },
        info: { icon: "info", title: "Informasi" }
      };

      const config = colorMap[type] || colorMap.success;
      Swal.fire({
        icon: config.icon,
        title: title || config.title,
        text: message,
        toast: true,
        position: "top-end",
        showConfirmButton: false,
        timer: 2200,
        timerProgressBar: true,
        customClass: {
          popup: "simart-swal"
        }
      });
    }

    function flash(message, type = "ok") {
      if (!window.Swal) return;
      const mapped = type === "err" ? "error" : "success";
      showSweetAlert(message, mapped, type === "err" ? "Gagal" : "Berhasil");

    function flyToCart(startRect, emoji) {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const target = document.querySelector(".cart-fab");
      let endX = window.innerWidth - 110;
      let endY = window.innerHeight - 110;
      if (target) {
        const r = target.getBoundingClientRect();
        endX = r.left + r.width / 2;
        endY = r.top + r.height / 2;
      }
      const sx = startRect ? startRect.left + startRect.width / 2 : endX;
      const sy = startRect ? startRect.top + startRect.height / 2 : endY;

      const flyer = document.createElement("div");
      flyer.className = "fly-to-cart";
      flyer.textContent = emoji || "🛍️";
      document.body.appendChild(flyer);

      const cx = (sx + endX) / 2;
      const cy = Math.min(sy, endY) - 130;
      const duration = 720;
      const t0 = performance.now();

      function step(now) {
        const t = Math.min((now - t0) / duration, 1);
        const inv = 1 - t;
        const x = inv * inv * sx + 2 * inv * t * cx + t * t * endX;
        const y = inv * inv * sy + 2 * inv * t * cy + t * t * endY;
        const scale = Math.max(1 - 0.55 * t, 0.3);
        flyer.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${scale}) rotate(${t * 30}deg)`;
        flyer.style.opacity = t > 0.85 ? String((1 - t) / 0.15) : "1";
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          flyer.remove();
          const cart = document.querySelector(".cart-fab");
          if (cart) {
            cart.classList.remove("cart-bump");
            void cart.offsetWidth;
            cart.classList.add("cart-bump");
          }
        }
      }
      requestAnimationFrame(step);
    }

    async function submitTopupPin() {
      if (!isAdmin()) {
        flash("Hanya admin yang dapat top up saldo.", "err");
        return;

      const student = selectedStudent();
      const pin = state.topupPinValue;

      if (pin.length < 6) {
        state.topupPinError = "Masukkan PIN 6 digit terlebih dahulu.";
        flash(state.topupPinError, "err");
        render();
        return;
      }

      if (pin !== "123456") {

        state.topupPinValue = "";
        flash(state.topupPinError, "err");
        render();
        return;
      }

      const cardId = student.card_id || student.cardId;
      const amount = state.topupAmount;
      try {
        const response = await fetch(`${API_BASE}/api/topup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cardId, amount, note: "Top up saldo" })
        });
        const result = await response.json();
        if (!response.ok || !result.ok) {
          throw new Error(result.message || "Gagal memproses top up");
        }
        if (result.data && result.data.saldoTerbaru != null) student.saldo = result.data.saldoTerbaru;
        else student.saldo = Number(student.saldo || 0) + amount;
      } catch (error) {
        if (!cardId) {
          student.saldo = Number(student.saldo || 0) + amount;
        } else {
          flash(error.message || "Gagal memproses top up.", "err");
          render();
          return;
        }
      }

      state.stats.topupTotal += amount;
      pushHistory({ type: "topup", name: student.name, amount });
      state.lastTopupAmount = amount;
      state.topupAmount = 0;
      state.customTopup = "";
      state.topupPhase = "success";
      flash("Top up berhasil.", "ok");
      render();
    }

    async function processRfidScan(cardId) {
      const normalized = String(cardId || "").trim();
      if (!normalized) {
        flash("Silakan tempel atau masukkan ID kartu santri terlebih dahulu.", "err");
        return;
      }

      try {
        state.scanAnimating = true;
        state.rfidInput = "Scanning...";
        render();

        const response = await fetch(`${API_BASE}/api/scan`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cardId: normalized })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.message || "Kartu tidak valid");
        }

        const student = result.data;
        upsertStudent(student);
        state.rfidScanned = true;
        state.rfidInput = "";
        state.activeTab = scanDestination();
        state.scanAnimating = false;
        showSweetAlert(`Santri terdeteksi: ${student.name}`, "success", "Scan berhasil");
        render();
      } catch (error) {
        state.scanAnimating = false;
        state.rfidInput = "";
        showSweetAlert(error.message || "Gagal membaca kartu RFID.", "error", "Scan gagal");
      }
    }

    let lastHandledScanId = 0;
    let scanPollTimer = null;

    async function pollLastScan() {
      if (!state.loggedIn || state.activeTab !== "scan" || state.scanAnimating) return;

      try {
        const response = await fetch(`${API_BASE}/api/last-scan`);
        const result = await response.json();

        if (!result.ok || !result.data) return;

        const scan = result.data;

        if (scan.scanId && scan.scanId !== lastHandledScanId) {
          lastHandledScanId = scan.scanId;

          if (scan.ok && scan.data) {
            upsertStudent(scan.data);
            state.rfidScanned = true;
            state.rfidInput = "";
            state.activeTab = scanDestination();
            render();
            showSweetAlert(`Santri terdeteksi: ${scan.data.name}`, "success", "Scan berhasil");
          } else {
            flash(scan.message || "Kartu tidak dikenali.", "err");
          }
        }
      } catch (error) {
      }
    }

    function startScanPolling() {
      if (scanPollTimer) return;

    function applyProductForm(fd, isEdit) {
      const emoji = fd.get("pemoji");
      const name = String(fd.get("pname") || "").trim();
      let cat = catKey(fd.get("pcat")) || "makanan";
      if (!CATEGORIES.some(c => c.key === cat)) cat = "makanan";
      const price = Number(String(fd.get("pprice") || "").replace(/[^0-9]/g, "")) || 0;

      if (!name || price <= 0) {
        flash("Nama dan harga produk wajib diisi.", "err");
        return false;
      }

      if (isEdit) {
        const p = state.products.find(x => x.id === state.editingProductId);
        if (p) { p.name = name; p.price = price; p.emoji = emoji || "📦"; p.cat = cat; }
        state.editingProductId = null;
      } else {
        const newId = state.products.length ? Math.max(...state.products.map(p => p.id)) + 1 : 1;
        state.products.push({ id: newId, name, price, emoji: emoji || "📦", cat });
      }

      state.productForm = { id: null, name: "", price: 0, emoji: "", cat: "" };
      state.productSearch = "";
      state.productCat = "all";
      return true;
    }

    function renderKeepScroll() {
      const scroller = document.querySelector(".main-scroll");
      const top = scroller ? scroller.scrollTop : window.scrollY || 0;
      render();
      requestAnimationFrame(() => {
        const el = document.querySelector(".main-scroll");
        if (el) el.scrollTop = top;
        else window.scrollTo(0, top);
      });
    }

    function render() {
      if (!state.loggedIn) {
        root.innerHTML = loginView();
        stopScanPolling();
        return;
      }

      if (!canOpenTab(state.activeTab)) state.activeTab = "home";

      const isMobile = window.innerWidth <= 1024;
      let content = "";
      if (state.activeTab === "home") content = homeView();
      else if (state.activeTab === "scan") content = scanView();
      else if (state.activeTab === "saldo") content = saldoView();
      else if (state.activeTab === "topup") content = topupView();
      else if (state.activeTab === "payment") content = paymentView();
      else if (state.activeTab === "products") content = productsView();
      else if (state.activeTab === "history") content = historyView();
      else if (state.activeTab === "santri") content = dataSantriView();
      else if (state.activeTab === "cart") content = cartView();

      root.innerHTML = `
        <div style="display:flex;min-height:100vh;">
          ${!isMobile ? sidebar() : ""}
          <main class="main">
            <div class="main-scroll">
              ${content}
            </div>
            ${cartWidget()}
            ${isMobile ? bottomNav() : ""}
          </main>
        </div>
      `;

      if (state.activeTab === "scan") {
        startScanPolling();
      } else {
        stopScanPolling();
      }

      applyCatalogFilter("paymentLists");
      applyCatalogFilter("productLists");

      if (state.paymentPhase === "pin") syncPinInput("paymentPinInput", state.pinValue);
    }

    document.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (e.target.id === "loginForm") {
        const data = new FormData(e.target);
        const user = String(data.get("username") || "").trim().toLowerCase();
        const pass = String(data.get("password") || "");
        const account = ACCOUNTS[user];
        if (account && account.password === pass) {
          state.loggedIn = true;
          state.role = account.role;
          state.loginUsername = user;
          flash(`Berhasil masuk sebagai ${account.label}.`, "ok");
          
          // JIKA KASIR MAKA LANGSUNG KE SCAN, JIKA ADMIN TETAP KE HOME (DASHBOARD)
          state.activeTab = account.role === "kasir" ? "scan" : "home";
          
          state.topupPhase = "none";
          state.paymentPhase = "none";
          await loadStudentsFromApi();
          await loadDashboardFromApi();
          render();
        } else {
          flash("Username atau kata sandi salah.", "err");
        }
      } else if (e.target.id === "rfidForm") {
        const input = document.getElementById("rfidInput");
        const val = input ? input.value : "";
        processRfidScan(val);
      } else if (e.target.id === "productForm") {
        const fd = new FormData(e.target);
        if (applyProductForm(fd, false)) {
          flash("Produk baru berhasil ditambahkan.", "ok");
          render();
        }
      } else if (e.target.id === "editProductForm") {
        const fd = new FormData(e.target);
        if (applyProductForm(fd, true)) {
          flash("Produk berhasil diperbarui.", "ok");
          renderKeepScroll();
        }
      } else if (e.target.id === "addStudentForm") {
        if (!isAdmin()) return;
        const fd = new FormData(e.target);
        const name = String(fd.get("sname") || "").trim();
        const password = String(fd.get("spass") || "");
        const kelas = String(fd.get("skelas") || "").trim() || "-";
        const saldo = Number(String(fd.get("ssaldo") || "0").replace(/[^\d]/g, ""));
        const cardId = String(fd.get("scard") || "").trim();

        if (!name) {
          flash("Nama santri wajib diisi.", "err");
          return;
        }
        if (password.length < 4) {
          flash("Password santri wajib diisi minimal 4 karakter.", "err");
          return;
        }

        try {
          const response = await fetch(`${API_BASE}/api/students`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, password, kelas, saldo, cardId })
          });
          const result = await response.json();
          if (!response.ok || !result.ok) {
            throw new Error(result.message || "Gagal menambahkan santri");
          }
          await loadStudentsFromApi();
          if (result.data && result.data.id != null) state.selectedStudentId = result.data.id;
          flash(`Santri "${result.data.name}" berhasil ditambahkan.`, "ok");
          state.activeTab = "saldo";
          render();
        } catch (error) {
          flash(error.message || "Gagal menambahkan santri.", "err");
        }
      } else if (e.target.id === "editStudentForm") {
        if (!isAdmin() || state.editingStudentId == null) return;
        const fd = new FormData(e.target);
        const name = String(fd.get("sname") || "").trim();
        const password = String(fd.get("spass") || "");
        const kelas = String(fd.get("skelas") || "").trim() || "-";
        const saldo = Number(String(fd.get("ssaldo") || "0").replace(/[^\d]/g, ""));
        const cardId = String(fd.get("scard") || "").trim();

        if (!name) {
          flash("Nama santri wajib diisi.", "err");
          return;
        }
        if (password.length < 4) {
          flash("Password santri wajib diisi minimal 4 karakter.", "err");
          return;
        }

        try {
          const response = await fetch(`${API_BASE}/api/students/${state.editingStudentId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, password, kelas, saldo, cardId })
          });
          const result = await response.json();
          if (!response.ok || !result.ok) {
            throw new Error(result.message || "Gagal memperbarui data santri");
          }
          await loadStudentsFromApi();
          flash(`Data santri "${result.data.name}" berhasil diperbarui.`, "ok");
          state.editingStudentId = null;
          render();
        } catch (error) {
          flash(error.message || "Gagal memperbarui data santri.", "err");
        }
      }
    });

    document.addEventListener("click", async (e) => {
      if (e.target && e.target.classList && e.target.classList.contains("product-modal-backdrop")) {
        if (state.editingProductId) {
          state.editingProductId = null;
          state.productForm = { id: null, name: "", price: 0, emoji: "", cat: "" };
          renderKeepScroll();
        }
        return;
      }

      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;

      if (action === "nav") {
        const tab = btn.dataset.tab;
        if (!canOpenTab(tab)) return;
        state.activeTab = tab;
        if (tab === "history") state.historyDetailId = null;
        state.paymentPhase = "none";
        state.pinValue = "";
        state.pinError = "";
        if (tab !== "topup") {
          state.topupPhase = "none";
          state.topupPinValue = "";
          state.topupPinError = "";
        }
        render();
        if (tab === "home") {
          loadDashboardFromApi().then(() => {
            if (state.loggedIn && state.activeTab === "home") render();
          });
        }
      } else if (action === "logout") {
        state.loggedIn = false;
        state.role = "";
        state.loginUsername = "";
        state.paymentPhase = "none";
        state.topupPhase = "none";
        state.cart = {};
        stopScanPolling();
        render();
      } else if (action === "select-student") {
        state.selectedStudentId = Number(btn.dataset.id);
        render();
      } else if (action === "santri-mode") {
        state.santriMode = btn.dataset.mode === "edit" ? "edit" : "add";
        state.editingStudentId = null;
        state.santriSearch = "";
        render();
      } else if (action === "edit-student") {
        state.editingStudentId = Number(btn.dataset.id);
        renderKeepScroll();
      } else if (action === "edit-student-back") {
        state.editingStudentId = null;
        renderKeepScroll();
      } else if (action === "add-product") {
        if (!isKasir()) return;
        const id = Number(btn.dataset.id);
        state.cart[id] = (state.cart[id] || 0) + 1;
        const rect = btn.getBoundingClientRect();
        const p = state.products.find(x => x.id === id);
        flyToCart(rect, p ? p.emoji : "🛍️");
        render();
      } else if (action === "cart-inc") {
        const id = Number(btn.dataset.id);
        state.cart[id] = (state.cart[id] || 0) + 1;
        render();
      } else if (action === "cart-dec") {
        const id = Number(btn.dataset.id);
        if (state.cart[id] > 1) {
          state.cart[id] -= 1;
        } else {
          delete state.cart[id];
        }
        render();
      } else if (action === "proceed-payment") {
        if (!isKasir()) return;
        state.activeTab = "cart";
        render();
      } else if (action === "open-payment-pin") {
        openPaymentPin();
      } else if (action === "cancel-payment") {
        state.paymentPhase = "none";
        state.pinValue = "";
        state.pinError = "";
        render();
      } else if (action === "pin-key") {
        if (state.pinValue.length < 6) {
          state.pinValue += btn.dataset.val;
          render();
        }
      } else if (action === "pin-del") {
        state.pinValue = state.pinValue.slice(0, -1);
        render();
      } else if (action === "pin-ok") {
        submitPinPayment();
      } else if (action === "edit-product") {
        const id = Number(btn.dataset.id);
        const p = state.products.find(x => x.id === id);
        if (p) {
          state.editingProductId = id;
          state.productForm = { ...p };
          renderKeepScroll();
        }
      } else if (action === "cancel-edit-product") {
        state.editingProductId = null;
        state.productForm = { id: null, name: "", price: 0, emoji: "", cat: "" };
        renderKeepScroll();
      } else if (action === "delete-product") {
        const id = Number(btn.dataset.id);
        const p = state.products.find(x => x.id === id);
        if (p && window.Swal) {
          Swal.fire({
            title: "Hapus produk ini?",
            html: `Yakin ingin menghapus <strong>${esc(p.name)}</strong> dari katalog?`,
            icon: "warning",
            showCancelButton: true,
            confirmButtonText: "Ya, Hapus",
            cancelButtonText: "Batal",
            confirmButtonColor: "#c42b34",
            cancelButtonColor: "#9f6a2b",
            reverseButtons: true,
            customClass: { popup: "simart-swal" }
          }).then((result) => {
            if (result.isConfirmed) {
              if (state.editingProductId === id) {
                state.editingProductId = null;
                state.productForm = { id: null, name: "", price: 0, emoji: "", cat: "" };
              }
              state.products = state.products.filter(x => x.id !== id);
              delete state.cart[id];
              flash("Produk berhasil dihapus.", "ok");
              renderKeepScroll();
            }
          });
        } else {
          state.products = state.products.filter(x => x.id !== id);
          delete state.cart[id];
          flash("Produk berhasil dihapus.", "ok");
          renderKeepScroll();
        }
      } else if (action === "history-detail") {
        state.historyDetailId = btn.dataset.id;
        state.activeTab = "history";
        render();
      } else if (action === "close-history-detail") {
        state.historyDetailId = null;
        render();
      } else if (action === "pick-topup") {
        state.topupAmount = Number(btn.dataset.amount || 0);
        state.customTopup = "";
        render();
      } else if (action === "open-topup-pin") {
        openTopupPin();
      } else if (action === "cancel-topup-pin") {
        state.topupPhase = "none";
        state.topupPinValue = "";
        state.topupPinError = "";
        render();
      } else if (action === "topup-pin-key") {
        if (state.topupPinValue.length < 6) {
          state.topupPinValue += btn.dataset.digit;
          state.topupPinError = "";
          render();
        }
      } else if (action === "topup-pin-del") {
        state.topupPinValue = state.topupPinValue.slice(0, -1);
        state.topupPinError = "";
        render();
      } else if (action === "topup-pin-submit") {
        submitTopupPin();
      } else if (action === "topup-success-done") {
        state.topupPhase = "none";
        state.activeTab = "saldo";
        render();
      }
    });

    document.addEventListener("click", (e) => {
      const chip = e.target.closest("[data-cat-filter]");
      if (!chip) return;
      const scope = chip.dataset.scope;
      const cat = chip.dataset.catFilter;
      if (scope === "product") state.productCat = cat;
      else state.paymentCat = cat;
      const listId = scope === "product" ? "productLists" : "paymentLists";
      document.querySelectorAll(`[data-cat-filter][data-scope="${scope}"]`).forEach(c => c.classList.toggle("active", c === chip));
      applyCatalogFilter(listId);
    });

    document.addEventListener("input", (e) => {
      const t = e.target;
      if (!t) return;
      if (t.id === "paymentPinInput") {
        const digits = String(t.value || "").replace(/\D/g, "").slice(0, 6);
        state.pinValue = digits;
        state.pinError = "";
        render();
        return;
      }
      if (t.id === "paymentSearch") {
        state.paymentSearch = t.value;
        applyCatalogFilter("paymentLists");
      } else if (t.id === "productSearch") {
        state.productSearch = t.value;
        applyCatalogFilter("productLists");
      } else if (t.id === "saldoSearch") {
        const pos = t.selectionStart;
        state.saldoSearch = t.value;
        render();
        const el = document.getElementById("saldoSearch");
        if (el) {
          el.focus();
          try { el.setSelectionRange(pos, pos); } catch (_) {}
        }
      } else if (t.id === "santriSearch") {
        const pos = t.selectionStart;
        state.santriSearch = t.value;
        render();
        const el = document.getElementById("santriSearch");
        if (el) {
          el.focus();
          try { el.setSelectionRange(pos, pos); } catch (_) {}
        }
      } else if (t.id === "customTopup") {
        state.customTopup = t.value;
        const n = Number(String(t.value || "").replace(/[^\d]/g, ""));
        if (n > 0) state.topupAmount = n;
      } else if (t.name === "pemoji") {
        const prev = document.getElementById("productEmojiPreview");
        if (prev) prev.textContent = t.value || "📦";
      }
    });

    document.addEventListener("keydown", (e) => {
      if (!state.loggedIn) return;

      const t = e.target;
      const tag = t ? t.tagName : "";
      const inTextField = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
      const pinActive = state.paymentPhase === "pin";
      const topupPinActive = state.topupPhase === "pin";

      if (e.key === "Enter") {
        if (state.paymentPhase === "pin") {
          e.preventDefault();
          submitPinPayment();
        } else if (state.topupPhase === "pin") {
          e.preventDefault();
          submitTopupPin();
        }
        return;
      }

      if (e.key === "Escape") {
        if (state.editingProductId) {
          state.editingProductId = null;
          state.productForm = { id: null, name: "", price: 0, emoji: "", cat: "" };
          renderKeepScroll();
          return;
        }
        if (state.paymentPhase === "pin") {
          state.paymentPhase = "none";
          state.pinValue = "";
          state.pinError = "";
          render();
        } else if (state.topupPhase === "pin") {
          state.topupPhase = "none";
          state.topupPinValue = "";
          state.topupPinError = "";
          render();
        }
        return;
      }

      // Dukungan keyboard fisik: tangani angka & hapus walau fokus di luar input PIN
      if (pinActive && !(inTextField && t.id !== "paymentPinInput")) {
        const current = state.pinValue;
        if (/^[0-9]$/.test(e.key)) {
          if (current.length < 6) {
            e.preventDefault();
            state.pinValue = current + e.key;
            state.pinError = "";
            render();
          }
          return;
        }
        if (e.key === "Backspace") {
          e.preventDefault();
          state.pinValue = current.slice(0, -1);
          state.pinError = "";
          render();
        }
      }

      if (topupPinActive && !inTextField) {
        const current = state.topupPinValue;
        if (/^[0-9]$/.test(e.key)) {
          if (current.length < 6) {
            e.preventDefault();
            state.topupPinValue = current + e.key;
            state.topupPinError = "";
            render();
          }
          return;
        }
        if (e.key === "Backspace") {
          e.preventDefault();
          state.topupPinValue = current.slice(0, -1);
          state.topupPinError = "";
          render();
        }
      }
    });

    document.addEventListener("click", (e) => {
      if (state.paymentPhase === "pin" && e.target && e.target.closest && e.target.closest("#paymentPinDisplay")) {
        const el = document.getElementById("paymentPinInput");
        if (el) el.focus();
      }
    });

    render();
  </script>
</body>
</html>
