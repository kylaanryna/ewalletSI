<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMART Kasir</title>
  <style>
    :root {
      --bg: #fce9ab;
      --surface: #fff7dc;
      --ink: #7d1028;
      --ink2: #9e3146;
      --muted: #9f6a2b;
      --line: rgba(196, 43, 52, 0.18);
      --line-soft: rgba(252, 143, 45, 0.14);
      --mint: #9f9820;
      --mint-tint: #ece8b8;
      --gold: #fc8f2d;
      --gold-tint: #ffe1b6;
      --orange: #dc417c;
      --orange-tint: #f9c6d7;
      --ink-tint: #f5d6d9;
      --danger: #c42b34;
      --shadow: 0 24px 60px -36px rgba(120, 26, 41, 0.36);
      --blush: #dc417c;
      --tomato: #c42b34;
      --vanilla: #fce9ab;
      --princeton: #fc8f2d;
      --olive: #9f9820;
      --radius: 28px;
      --radius-lg: 36px;
      --radius-md: 22px;
      --radius-sm: 16px;
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    input, select {
      outline: none;
    }
    .app-shell {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(220, 65, 124, 0.28), transparent 34%),
        radial-gradient(circle at bottom right, rgba(159, 152, 32, 0.2), transparent 30%),
        var(--bg);
    }
    .bg-orb {
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(110px);
      opacity: 0.55;
    }
    .orb-a {
      width: 420px;
      height: 420px;
      top: -130px;
      left: -140px;
      background: rgba(220, 65, 124, 0.34);
      animation: floatOrb 18s ease-in-out infinite alternate;
    }
    .orb-b {
      width: 380px;
      height: 380px;
      bottom: -150px;
      right: -90px;
      background: rgba(159, 152, 32, 0.24);
      animation: floatOrb 20s ease-in-out infinite alternate-reverse;
    }
    @keyframes floatOrb {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(8px, -8px, 0) scale(1.02); }
    }
    .root {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }
    .login-wrap,
    .main-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card-shell {
      width: 100%;
      max-width: 1180px;
      border-radius: 34px;
      overflow: hidden;
      background: rgba(255, 247, 220, 0.82);
      border: 1px solid rgba(196, 43, 52, 0.14);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      animation: none;
    }
    .login-grid {
      display: grid;
      grid-template-columns: 1.14fr 0.86fr;
      min-height: 680px;
    }
    .hero {
      padding: 42px 44px 36px;
      background: linear-gradient(135deg, #d63d6a 0%, #c72c4f 24%, #d65d56 52%, #e9844a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      animation: none;
    }
    .hero::after {
      content: "";
      position: absolute;
      right: -70px;
      bottom: -90px;
      width: 320px;
      height: 320px;
      border-radius: 999px;
      background: rgba(255, 247, 220, 0.10);
      filter: blur(8px);
      pointer-events: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 20px;
      line-height: 1;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(24, 26, 20, 0.08);
      flex: 0 0 auto;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .profile-avatar {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      object-fit: contain;
      background: #fff;
      padding: 2px;
      box-sizing: border-box;
      box-shadow: 0 0 0 1px rgba(24, 26, 20, 0.08);
      display: block;
      flex: 0 0 auto;
    }
    h1, h2, h3, p { margin: 0; }
    .hero h1 {
      margin-top: 34px;
      font-size: clamp(2.4rem, 4vw, 4.1rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
      position: relative;
      z-index: 1;
      max-width: 420px;
      color: #fffaf0;
    }
    .hero p.lead {
      margin-top: 18px;
      max-width: 460px;
      color: rgba(255, 247, 220, 0.9);
      font-size: 15px;
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }
    .hero-badges {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 247, 220, 0.14);
      border: 1px solid rgba(255, 247, 220, 0.20);
      box-shadow: 0 12px 24px -18px rgba(120, 26, 41, 0.45);
      color: #fff7dc;
      font-weight: 700;
      font-size: 13px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      backdrop-filter: blur(2px);
    }
    .badge:hover { transform: translateY(-1px); box-shadow: 0 14px 22px -20px rgba(24, 26, 20, 0.5); }
    .badge small { display: block; color: rgba(255, 247, 220, 0.78); font-weight: 600; font-size: 11px; margin-top: 2px; }
    .login-form {
      padding: 54px 56px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(180deg, #f8f2dd 0%, #f4ead1 100%);
    }
    .title {
      font-size: clamp(2.2rem, 3vw, 3rem);
      letter-spacing: -0.06em;
      line-height: 1.05;
      color: var(--ink);
      font-weight: 800;
    }
    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }
    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink2);
    }
    .input-shell, .select-shell {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 16px;
      border-radius: 18px;
      background: rgba(252, 233, 171, 0.42);
      border: 1.5px solid rgba(196, 43, 52, 0.12);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }
    .input-shell:focus-within {
      border-color: rgba(196, 43, 52, 0.26);
      box-shadow: 0 0 0 3px rgba(196, 43, 52, 0.07);
    }
    .input-shell input, .select-shell select {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
    }
    .input-icon {
      width: 18px;
      color: var(--muted);
      flex: 0 0 auto;
      text-align: center;
      font-size: 14px;
    }
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 15px 18px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.14s ease, opacity 0.14s ease, box-shadow 0.14s ease;
      text-decoration: none;
      white-space: nowrap;
      will-change: transform;
      font-size: 15px;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: scale(0.99) translateY(0); }
    .btn-dark { background: linear-gradient(135deg, #c94062, #b81e44); color: white; box-shadow: 0 16px 26px -18px rgba(196, 43, 52, 0.82); }
    .btn-mint { background: linear-gradient(135deg, #b9bd4f, #9b9b20); color: white; box-shadow: 0 16px 26px -18px rgba(159, 152, 32, 0.82); }
    .btn-orange { background: linear-gradient(135deg, #f7b15d, #ea8d39); color: white; box-shadow: 0 16px 26px -18px rgba(252, 143, 45, 0.82); }
    .btn-ghost { background: transparent; color: var(--ink2); border: 1px solid var(--line); }
    .helper {
      margin-top: 8px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .sidebar {
      width: 280px;
      flex: 0 0 auto;
      background: linear-gradient(180deg, #fff9e4 0%, #ffe8bd 100%);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 20px;
      min-height: 100vh;
    }
    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 26px;
    }
    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 13px 14px;
      border-radius: 18px;
      color: var(--ink2);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .nav-btn.active {
      background: var(--tomato);
      color: #fff;
      box-shadow: 0 14px 24px -20px rgba(196, 43, 52, 0.72);
    }
    .nav-btn {
      transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }
    .nav-btn:hover {
      transform: translateX(3px);
    }
    .nav-pill {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.8;
      flex: 0 0 auto;
    }
    .main {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-scroll {
      flex: 1 1 auto;
      padding: 30px 24px 24px;
      overflow: auto;
    }
    .panel {
      background: rgba(255, 250, 236, 0.84);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: 0 18px 40px -32px rgba(120, 26, 41, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      animation: none;
    }
    .panel:hover,
    .quick-card:hover,
    .student-card:hover,
    .product:hover,
    .history-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 28px -22px rgba(24, 26, 20, 0.28);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .page-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .product-panel {
      padding: 8px 10px 12px;
      border-radius: 20px;
      background: rgba(247, 238, 217, 0.9);
      border: 2px solid rgba(124, 30, 46, 0.18);
      box-shadow: 0 12px 22px -20px rgba(97, 44, 31, 0.38);
    }
    .product-panel .section-title {
      margin: 0 0 8px;
      font-size: clamp(1.2rem, 1.5vw, 1.6rem);
      letter-spacing: -0.04em;
      line-height: 1.1;
      color: var(--ink);
    }
    .product-form {
      display: grid;
      grid-template-columns: 0.55fr 1.9fr 1.2fr 1fr;
      gap: 5px;
      align-items: stretch;
    }
    .product-field {
      display: flex;
      align-items: center;
      min-height: 42px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(124, 30, 46, 0.2);
      border-radius: 9px;
      padding: 0 8px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .product-field input {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .product-field input::placeholder {
      color: rgba(124, 30, 46, 0.54);
    }
    .product-actions {
      display: flex;
      justify-content: flex-start;
      margin-top: 8px;
    }
    .product-primary-btn {
      min-width: 104px;
      height: 42px;
      padding: 0 18px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, #c63b62 0%, #a61942 100%);
      color: #fff8ef;
      font-size: clamp(1.05rem, 1.2vw, 1.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      box-shadow: 0 10px 16px -16px rgba(140, 32, 54, 0.9);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }
    .product-primary-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.02);
      box-shadow: 0 20px 28px -18px rgba(140, 32, 54, 0.94);
    }
    .home-hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
    }
    .hero-card {
      padding: 24px;
      border-radius: 28px;
      background: linear-gradient(155deg, rgba(220, 65, 124, 0.96), rgba(196, 43, 52, 0.94), rgba(252, 143, 45, 0.92));
      position: relative;
      overflow: hidden;
      min-height: 180px;
      animation: fadeUp 0.6s ease both;
      color: #fff7dc;
    }
    .hero-card h2 {
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -0.04em;
      max-width: 470px;
    }
    .hero-card p {
      margin-top: 10px;
      max-width: 420px;
      color: rgba(255, 247, 220, 0.88);
      line-height: 1.6;
    }
    .hero-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 10px 14px;
      background: rgba(255, 247, 220, 0.95);
      color: var(--tomato);
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      animation: none;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .stat-card {
      padding: 18px;
      border-radius: 24px;
      background: linear-gradient(180deg, #fff9e8 0%, #ffe7bf 100%);
      border: 1px solid var(--line);
      animation: fadeUp 0.55s ease both;
    }
    .stat-value {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.04em;
      margin-top: 10px;
    }
    .stat-label {
      color: var(--ink2);
      font-size: 12px;
      margin-top: 4px;
      font-weight: 600;
    }
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .quick-card {
      padding: 18px;
      border-radius: 26px;
      min-height: 150px;
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: none;
    }
    .quick-card strong { font-size: 16px; line-height: 1.35; }
    .student-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .student-card {
      border-radius: 24px;
      padding: 16px;
      border: 1.5px solid var(--line);
      background: rgba(255, 250, 236, 0.96);
      text-align: left;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      animation: none;
    }
    .student-card.active {
      border-color: var(--blush);
      box-shadow: 0 12px 28px -20px rgba(220, 65, 124, 0.8);
      background: linear-gradient(180deg, #fff0cf 0%, #fff7dc 100%);
    }
    .student-name {
      font-weight: 800;
      font-size: 15px;
    }
    .student-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    .two-col {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 18px;
      align-items: start;
    }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .product {
      padding: 16px;
      border-radius: 22px;
      background: linear-gradient(180deg, #fff9ea 0%, #ffe7bb 100%);
      border: 1px solid var(--line);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: none;
    }
    .product-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }
    .emoji-dot {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--bg);
      border: 1px solid var(--line);
      flex: 0 0 auto;
      font-size: 16px;
    }
    .product-name {
      font-weight: 800;
      font-size: 14px;
      margin-top: 12px;
    }
    .product-cat {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }
    .cart {
      padding: 18px;
      border-radius: 28px;
      background: #fff9e8;
      border: 1px solid var(--line);
      position: sticky;
      top: 18px;
      animation: fadeUp 0.6s ease both;
    }
    /* New: compact cart icon and dropdown */
    .cart-root { position: relative; }
    .cart-icon {
      position: fixed;
      right: 34px;
      top: 34px;
      z-index: 1200;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg,#fff,#fff9e8);
      border: 1px solid var(--line);
      padding: 10px 12px;
      border-radius: 999px;
      box-shadow: 0 12px 28px -18px rgba(24,26,20,0.28);
    }
    .cart-badge {
      display: inline-flex;
      min-width: 28px;
      height: 28px;
      border-radius: 999px;
      align-items: center;
      justify-content: center;
      background: var(--tomato);
      color: white;
      font-weight: 900;
      padding: 0 8px;
      box-shadow: 0 8px 18px -10px rgba(196,43,52,0.6);
    }
    .cart-dropdown {
      position: absolute;
      right: 0;
      top: 56px;
      width: 320px;
      background: rgba(255,255,255,0.98);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 22px 40px -28px rgba(24,26,20,0.36);
    }
    .cart-dropdown .muted { font-size: 13px; }
    .floating-cta {
      position: sticky;
      top: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 18px;
      border-radius: 999px;
      background: linear-gradient(90deg,#f7b15d,#ea8d39);
      color: white;
      font-weight: 900;
      box-shadow: 0 12px 28px -18px rgba(252,143,45,0.6);
      border: 0;
    }
    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .qty {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(252, 233, 171, 0.58);
      border-radius: 999px;
      padding: 4px;
      border: 1px solid var(--line);
    }
    .qty button {
      border: 0;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #fff9e8;
      color: var(--ink);
      font-weight: 900;
    }
    .cart-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-weight: 800;
    }
    .topup-grid {
      display: grid;
      grid-template-columns: 0.96fr 1.04fr;
      gap: 18px;
      align-items: stretch;
    }
    .topup-hero {
      padding: 24px 22px 20px;
      border-radius: 30px;
      background: linear-gradient(135deg, #f0b25c 0%, #e9985c 24%, #e27967 54%, #d95d7a 100%);
      color: #fff7dc;
      box-shadow: 0 24px 40px -28px rgba(141, 34, 50, 0.42);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.18);
    }
    .topup-hero::before {
      content: "";
      position: absolute;
      inset: auto -40px -48px auto;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      filter: blur(10px);
    }
    .topup-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.85;
      position: relative;
      z-index: 1;
    }
    .topup-value {
      margin-top: 18px;
      font-size: clamp(2.2rem, 3vw, 3.1rem);
      font-weight: 900;
      letter-spacing: -0.06em;
      color: #fff7dc;
      line-height: 1;
      position: relative;
      z-index: 1;
    }
    .topup-note {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,247,220,0.92);
      font-weight: 600;
      position: relative;
      z-index: 1;
    }
    .topup-card {
      background: linear-gradient(180deg, rgba(255,252,244,0.98), rgba(255,245,225,0.92));
      border: 1px solid rgba(196, 43, 52, 0.1);

    }
    .topup-card .section-title {
      font-size: 14px;
      letter-spacing: -0.02em;

    }
    .chip-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .chip {
      border: 1px solid rgba(24,26,20,0.08);
      background: linear-gradient(180deg, rgba(220, 65, 124, 0.08), rgba(255,255,255,0.8));
      border-radius: 18px;
      padding: 14px 10px;
      font-weight: 800;
      color: var(--ink2);
      transition: transform 0.18s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
    }
    .chip:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px -16px rgba(24,26,20,0.35);
    }
    .chip.active {
      background: linear-gradient(135deg, #df6a8e 0%, #c63d65 100%);
      color: white;
      border-color: transparent;
      box-shadow: 0 16px 26px -18px rgba(196, 43, 52, 0.78);
    }
    .custom-topup {
      margin-top: 18px;
    }
    .custom-topup-label {
      display: block;
      margin-bottom: 8px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .input-shell {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      border-radius: 18px;
      background: rgba(252,233,171,0.38);
      border: 1.5px solid rgba(24,26,20,0.08);
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .input-shell:focus-within {
      border-color: rgba(196,43,52,0.22);
      box-shadow: 0 0 0 3px rgba(196,43,52,0.08);
    }
    .topup-cta {
      width: 100%;
      margin-top: 20px;
      border: 0;
      border-radius: 999px;
      padding: 16px 18px;
      background: linear-gradient(135deg, #c9c147 0%, #9d9a1d 100%);
      color: #fffdf7;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      box-shadow: 0 18px 26px -18px rgba(122, 110, 20, 0.8);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .topup-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 21px 28px -18px rgba(122, 110, 20, 0.82);
    }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .history-card {
      padding: 16px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #fff8e8 0%, #ffe7bf 100%);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: none;
    }
    .history-card.payment { background: linear-gradient(180deg, rgba(220, 65, 124, 0.18), #fff7dc); }
    .history-card.topup { background: linear-gradient(180deg, rgba(159, 152, 32, 0.18), #fff7dc); }
    .history-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 6px 10px;
      background: #fff9e8;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 800;
    }
    .flash {
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: 18px;
      font-weight: 700;
      border: 1px solid transparent;
      animation: none;
    }
    .flash.ok { background: rgba(159, 152, 32, 0.15); border-color: rgba(159, 152, 32, 0.3); color: #6d6513; }
    .flash.err { background: rgba(196, 43, 52, 0.12); border-color: rgba(196, 43, 52, 0.26); color: var(--danger); }

    .pin-panel {
      padding: 24px;
      background: linear-gradient(180deg, rgba(255,249,232,0.96), rgba(255,241,214,0.94));
      border-radius: 30px;
    }
    .pin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }
    .pin-summary {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border-radius: 24px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
    }
    .pin-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(220,65,124,0.18), rgba(252,143,45,0.22));
      font-size: 24px;
    }
    .pin-total {
      margin: 18px 0 10px;
      text-align: center;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 900;
      letter-spacing: -0.06em;
      color: var(--tomato);
    }
    .pin-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0 18px;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: rgba(24,26,20,0.12);
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .pin-dot.filled {
      background: var(--tomato);
      transform: scale(1.08);
    }
    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      max-width: 320px;
      margin: 18px auto 0;
    }
    .pin-key {
      border: 0;
      border-radius: 18px;
      background: rgba(252,233,171,0.6);
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 800;
      min-height: 56px;
      box-shadow: inset 0 0 0 1px rgba(24,26,20,0.04);
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .pin-key:hover { transform: translateY(-1px); }
    .pin-key:active { transform: scale(0.98); }
    .pin-del {
      background: rgba(220,65,124,0.12);
      color: var(--tomato);
    }
    .pin-actions {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 12px;
      margin-top: 20px;
    }
    .success-panel {
      padding: 28px 20px;
      text-align: center;
      border-radius: 30px;
      background: linear-gradient(180deg, rgba(255,249,232,0.96), rgba(240,246,224,0.9));
    }
    .success-badge {
      width: 82px;
      height: 82px;
      margin: 0 auto 18px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(159,152,32,0.16), rgba(220,65,124,0.14));
      color: var(--olive);
      font-size: 2.2rem;
      font-weight: 900;
    }
    .success-title {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      margin-bottom: 10px;
      color: var(--ink);
    }
    .success-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.68);
    }
    .success-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 8px 0;
      color: var(--ink2);
      font-size: 12.5px;
    }
    .success-row + .success-row {
      border-top: 1px dashed rgba(24,26,20,0.12);
    }
    .bottom-nav {
      display: none;
      position: sticky;
      bottom: 0;
      padding: 14px 14px 18px;
      background: linear-gradient(180deg, transparent, rgba(252, 233, 171, 0.98) 20%);
    }
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 999px;
      background: var(--tomato);
    }
    .bottom-bar .nav-btn {
      color: rgba(255,247,220,0.75);
      justify-content: center;
      padding: 11px 12px;
      flex: 1 1 0;
    }
    .bottom-bar .nav-btn.active {
      color: white;
      background: rgba(255,247,220,0.16);
    }
    .bottom-bar .nav-btn:hover {
      transform: translateY(-2px);
    }

    .hero h1,
    .title,
    .section-title,
    .stat-value,
    .product-name,
    .student-name {
      text-wrap: balance;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .bg-orb, .hero::after {
        animation: none !important;
      }
    }

    @media (max-width: 1024px) {
      .card-shell { border-radius: 28px; }
      .login-grid,
      .home-hero,
      .two-col,
      .topup-grid,
      .history-grid {
        grid-template-columns: 1fr;
      }
      .sidebar { display: none; }
      .main-scroll { padding: 18px 14px 10px; }
      .bottom-nav { display: block; }
      .student-row,
      .catalog-grid,
      .chip-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .quick-actions { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .login-wrap, .main-wrap { padding: 0; }
      .card-shell { border-radius: 0; min-height: 100vh; }
      .hero, .login-form { padding: 22px 18px; }
      .title { font-size: 30px; }
      .hero h1 { font-size: 28px; }
      .student-row,
      .catalog-grid,
      .chip-grid {
        grid-template-columns: 1fr;
      }
      .stat-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div id="root" class="root"></div>
  </div>

  <script>
    const state = {
      loggedIn: false,
      loginUsername: "",
      loginPassword: "",
      activeTab: "home",
      selectedStudentId: 1,
      cart: {},
      topupAmount: 0,
      cartOpen: false,
      lastOrder: null,
      editingProductId: null,
      productForm: { id: null, name: "", price: 0, emoji: "", cat: "" },
      notice: "",
      noticeType: "ok",
      paymentPhase: "none",
      paymentTotal: 0,
      pinValue: "",
      pinError: "",
      topupPhase: "none",
      topupPinValue: "",
      topupPinError: "",
      students: [
        { id: 1, name: "Ahmad Fauzan", kelas: "VII A - Ibnu Sina", saldo: 85000 },
        { id: 2, name: "Siti Aisyah", kelas: "VIII A - Az-Zahra", saldo: 42500 },
        { id: 3, name: "Muhammad Rizki", kelas: "IX A - Al-Farabi", saldo: 128000 }
      ],
      products: [
        { id: 1, name: "Roti Coklat", price: 4000, emoji: "B" , cat: "Makanan" },
        { id: 2, name: "Nasi Uduk", price: 8000, emoji: "N", cat: "Makanan" },
        { id: 3, name: "Keripik Singkong", price: 3500, emoji: "K", cat: "Makanan" },
        { id: 4, name: "Donat Gula", price: 3000, emoji: "D", cat: "Makanan" },
        { id: 5, name: "Telur Gulung", price: 2500, emoji: "T", cat: "Makanan" },
        { id: 6, name: "Air Mineral", price: 3000, emoji: "A", cat: "Minuman" },
        { id: 7, name: "Teh Kotak", price: 4000, emoji: "T", cat: "Minuman" },
        { id: 8, name: "Susu Kotak", price: 5000, emoji: "S", cat: "Minuman" },
        { id: 9, name: "Es Cincau", price: 4500, emoji: "E", cat: "Minuman" },
        { id: 10, name: "Buku Tulis", price: 4500, emoji: "B", cat: "Alat Tulis" },
        { id: 11, name: "Pulpen", price: 2500, emoji: "P", cat: "Alat Tulis" },
        { id: 12, name: "Penghapus", price: 1500, emoji: "H", cat: "Alat Tulis" }
      ],
      chips: [10000, 20000, 50000, 100000, 200000],
      history: [
        { id: 1, type: "payment", name: "Ahmad Fauzan", amount: 12000, admin: "Admin", time: "08:12" },
        { id: 2, type: "topup", name: "Siti Aisyah", amount: 50000, admin: "Admin", time: "09:05" }
      ],
      stats: { transaksi: 12, topupTotal: 350000 }
    };

    const root = document.getElementById("root");

    const rupiah = (n) => "Rp" + Math.round(n).toLocaleString("id-ID");
    const esc = (v) => String(v).replace(/[&<>\"']/g, (m) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]));
    const selectedStudent = () => state.students.find((s) => s.id === state.selectedStudentId) || state.students[0];
    const cartItems = () => Object.entries(state.cart).map(([id, qty]) => {
      const p = state.products.find((x) => x.id === Number(id));
      return p ? { ...p, qty } : null;
    }).filter(Boolean);
    const cartTotal = () => cartItems().reduce((sum, item) => sum + item.price * item.qty, 0);

    function cartWidget() {
      const items = cartItems();
      const total = cartTotal();
      const qty = items.reduce((s, it) => s + it.qty, 0);
      const last = state.lastOrder;
      if (qty === 0) return "";

      return `
        <div class="cart-root" aria-hidden="false">
          <button class="cart-icon" data-action="proceed-payment" aria-label="Berikut">
            <div class="cart-badge">${qty}</div>
            <div style="font-weight:800;">Berikut</div>
          </button>
        </div>
      `;
    }

    function flash(message, type = "ok") {
      state.notice = message;
      state.noticeType = type;
      render();
      clearTimeout(flash._t);
      flash._t = setTimeout(() => {
        state.notice = "";
        render();
      }, 2200);
    }

    function pushHistory(entry) {
      state.history = [
        {
          id: Date.now(),
          time: new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }),
          admin: "Admin",
          ...entry
        },
        ...state.history
      ];
    }

    function openPaymentPin() {
      const student = selectedStudent();
      const total = cartTotal();
      if (total <= 0) {
        flash("Keranjang masih kosong.", "err");
        return;
      }
      if (student.saldo < total) {
        state.topupAmount = total - student.saldo;
        state.paymentPhase = "none";
        state.pinValue = "";
        state.pinError = "";
        state.notice = "Saldo tidak mencukupi. Silakan top up saldo terlebih dahulu.";
        state.noticeType = "err";
        state.activeTab = "topup";
        render();
        return;
      }
      state.paymentTotal = total;
      state.pinValue = "";
      state.pinError = "";
      state.paymentPhase = "pin";
      render();
    }

    function submitPinPayment() {
      const student = selectedStudent();
      const pin = state.pinValue;

      if (pin.length < 6) {
        state.pinError = "Masukkan PIN 6 digit terlebih dahulu.";
        render();
        return;
      }

      if (pin !== "123456") {
        state.pinError = "PIN salah. Silakan coba lagi.";
        state.pinValue = "";
        render();
        return;
      }

      state.pinError = "";
      // save last order details so cart icon can show it
      state.lastOrder = {
        studentName: student.name,
        items: cartItems(),
        total: state.paymentTotal,
        time: new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" })
      };
      student.saldo -= state.paymentTotal;
      state.stats.transaksi += 1;
      pushHistory({ type: "payment", name: student.name, amount: state.paymentTotal });
      state.cart = {};
      state.cartOpen = false;
      state.paymentPhase = "success";
      state.activeTab = "history";
      render();
    }

    function openTopupPin() {
      const custom = document.getElementById("customTopup");
      const customAmount = custom ? Number(String(custom.value || "").replace(/[^\d]/g, "")) : 0;
      const amount = state.topupAmount || customAmount;
      const student = selectedStudent();
      if (!amount || amount <= 0) {
        flash("Pilih nominal top up dulu.", "err");
        return;
      }
      if (!student) {
        flash("Pilih santri terlebih dahulu.", "err");
        return;
      }
      state.topupPinValue = "";
      state.topupPinError = "";
      state.topupAmount = amount;
      state.topupPhase = "pin";
      render();
    }

    function submitTopupPin() {
      const student = selectedStudent();
      const pin = state.topupPinValue;

      if (pin.length < 6) {
        state.topupPinError = "Masukkan PIN 6 digit terlebih dahulu.";
        render();
        return;
      }

      if (pin !== "123456") {
        state.topupPinError = "PIN salah. Silakan coba lagi.";
        state.topupPinValue = "";
        render();
        return;
      }

      student.saldo += state.topupAmount;
      state.stats.topupTotal += state.topupAmount;
      pushHistory({ type: "topup", name: student.name, amount: state.topupAmount });
      state.topupAmount = 0;
      state.topupPhase = "success";
      state.activeTab = "history";
      render();
    }

    function loginView() {
      return `
        <div class="login-wrap">
          <div class="card-shell">
            <div class="login-grid">
              <section class="hero">
                <div class="brand">
                  <div class="logo" aria-hidden="true">
                    <img src="assets/simart-logo.png" alt="SIMART" />
                  </div>
                  <div>SIMART</div>
                </div>
                <h1>Kelola SIMART<br/></h1>
                <p class="lead">
                  Mulia di Dunia dengan Teknologi, Bisnis dan Dakwah.
                </p>
                <div class="hero-badges">
                  <div class="badge">Pembayaran <small>Jadi lebih mudah</small></div>
                  <div class="badge">Transaksi <small>Aman</small></div>
                </div>
              </section>
              <section class="login-form">
                <div>
                  <div class="title">Masuk ke aplikasi</div>
                  <p class="muted" style="margin-top:10px;">Gunakan demo login: <strong>admin</strong> / <strong>admin123</strong></p>
                </div>
                <form id="loginForm">
                  <div class="field" style="margin-bottom:14px;">
                    <label>Username</label>
                    <div class="input-shell">
                      <span class="input-icon">U</span>
                      <input name="username" autocomplete="username" placeholder="admin" />
                    </div>
                  </div>
                  <div class="field" style="margin-bottom:14px;">
                    <label>Kata sandi</label>
                    <div class="input-shell">
                      <span class="input-icon">P</span>
                      <input name="password" type="password" autocomplete="current-password" placeholder="admin123" />
                    </div>
                  </div>
                  <button class="btn btn-orange" type="submit" style="width:100%;">Masuk</button>
                </form>
              </section>
            </div>
          </div>
        </div>
      `;
    }

    function sidebar() {
      const tabs = [
        ["home", "Home"],
        ["payment", "Bayar"],
        ["topup", "Top Up"],
        ["products", "Produk"],
        ["history", "Riwayat"]
      ];
      return `
        <aside class="sidebar">
          <div>
            <div class="brand">
              <div class="logo" aria-hidden="true" style="width:38px;height:38px;border-radius:12px;">
                <img src="assets/simart-logo.png" alt="SIMART" />
              </div>
              <div>SIMART</div>
            </div>
            <nav>
              ${tabs.map(([key, label]) => `
                <button class="nav-btn ${state.activeTab === key ? "active" : ""}" data-action="nav" data-tab="${key}">
                  <span class="nav-pill"></span>
                  <span>${label}</span>
                </button>
              `).join("")}
            </nav>
          </div>
          <div>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
              <img class="profile-avatar" src="assets/simart-logo.png" alt="Profil SIMART" />
              <div>
                <div style="font-weight:800;">Admin</div>
                <div style="font-size:12px;color:var(--muted);">Kasir SIMART</div>
              </div>
            </div>
            <button class="btn btn-ghost" style="width:100%;" data-action="logout">Keluar</button>
          </div>
        </aside>
      `;
    }

    function bottomNav() {
      const tabs = [
        ["home", "Home"],
        ["payment", "Bayar"],
        ["topup", "Top Up"],
        ["products", "Produk"],
        ["history", "Riwayat"]
      ];
      return `
        <div class="bottom-nav">
          <div class="bottom-bar">
            ${tabs.map(([key, label]) => `
              <button class="nav-btn ${state.activeTab === key ? "active" : ""}" data-action="nav" data-tab="${key}">
                <span>${label}</span>
              </button>
            `).join("")}
          </div>
        </div>
      `;
    }

    function homeView() {
      return `
        <div class="page-grid">
          ${state.notice ? `<div class="flash ${state.noticeType === "err" ? "err" : "ok"}">${esc(state.notice)}</div>` : ""}
          <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;">
            <div>
              <div class="muted">Selamat datang kembali</div>
              <h2 style="font-size:24px;letter-spacing:-0.04em;margin-top:4px;">Admin</h2>
            </div>
            <button class="btn btn-dark" data-action="nav" data-tab="payment">Mulai Bayar</button>
          </div>

          <div class="home-hero">
            <section class="hero-card">
              <h2>Kelola transaksi santri dengan cepat</h2>
              <p>Top up saldo, catat pembayaran, dan lihat riwayat transaksi dalam satu tampilan yang nyaman dipakai di laptop maupun tablet.</p>
              <div class="hero-chip">Top Up Sekarang</div>
            </section>
            <section class="stat-grid">
              <div class="stat-card" style="animation-delay:0.08s;">
                <div style="font-size:12px;color:var(--muted);font-weight:700;">Transaksi</div>
                <div class="stat-value">${state.stats.transaksi}</div>
                <div class="stat-label">Hari ini</div>
              </div>
              <div class="stat-card" style="animation-delay:0.16s;">
                <div style="font-size:12px;color:var(--muted);font-weight:700;">Top Up</div>
                <div class="stat-value">${rupiah(state.stats.topupTotal)}</div>
                <div class="stat-label">Total top up</div>

    function render() {
      root.innerHTML = state.loggedIn ? appView() : loginView();
    }

    root.addEventListener("submit", (e) => {
      if (e.target && e.target.id === "loginForm") {
        e.preventDefault();
        const fd = new FormData(e.target);
        const username = String(fd.get("username") || "").trim();
        const password = String(fd.get("password") || "");
        if (username === "admin" && password === "admin123") {
          state.loggedIn = true;
          state.activeTab = "home";
          state.selectedStudentId = 1;
          state.notice = "";
          render();
        } else {
          flash("Username atau kata sandi salah.", "err");
        }
      }

      // product form submit (add / save)
      if (e.target && e.target.id === "productForm") {
        e.preventDefault();
        const fd = new FormData(e.target);
        const emoji = String(fd.get("pemoji") || "").trim();
        const name = String(fd.get("pname") || "").trim();
        const cat = String(fd.get("pcat") || "").trim() || "Umum";
        const price = Number(String(fd.get("pprice") || "0").replace(/[^0-9]/g, "")) || 0;
        if (!name || price <= 0) {
          flash("Nama dan harga produk harus diisi.", "err");
          return;
        }

        if (state.editingProductId) {
          // update
          const idx = state.products.findIndex(p => p.id === state.editingProductId);
          if (idx >= 0) {
            state.products[idx] = { ...state.products[idx], emoji, name, cat, price };
            flash("Produk diperbarui.", "ok");
          }
          state.editingProductId = null;
          state.productForm = { id: null, name: "", price: 0, emoji: "", cat: "" };
          render();
          return;
        }

        // add new
        const id = Date.now();
        state.products.push({ id, name, price, emoji: emoji || "•", cat });
        flash("Produk ditambahkan.", "ok");
        state.productForm = { id: null, name: "", price: 0, emoji: "", cat: "" };
        render();
      }
    });

    root.addEventListener("click", (e) => {
      const el = e.target.closest("[data-action]");
      if (!el) return;
      const action = el.dataset.action;

      if (action === "logout") {
        state.loggedIn = false;
        state.cart = {};
        state.topupAmount = 0;
        state.paymentPhase = "none";
        state.paymentTotal = 0;
        state.pinValue = "";
        state.pinError = "";
        state.notice = "";
        render();
        return;
      }

      if (action === "toggle-cart") {
        state.cartOpen = !state.cartOpen;
        render();
        return;
      }

      if (action === "proceed-payment") {
        state.activeTab = 'cart';
        state.cartOpen = false;
        render();
        return;
      }

      if (action === "open-payment-pin") {
        // from cart page: open PIN to confirm payment
        openPaymentPin();
        return;
      }

      if (action === "nav") {
        state.activeTab = el.dataset.tab;
        state.paymentPhase = "none";
        state.paymentTotal = 0;
        state.pinValue = "";
        state.pinError = "";
        state.notice = "";
        render();
        return;
      }

      if (action === "select-student") {
        state.selectedStudentId = Number(el.dataset.id);
        render();
        return;
      }

      if (action === "add-product") {
        const id = Number(el.dataset.id);
        state.cart[id] = (state.cart[id] || 0) + 1;
        render();
        return;
      }

      if (action === "cart-inc") {
        const id = Number(el.dataset.id);
        state.cart[id] = (state.cart[id] || 0) + 1;
        render();
        return;
      }

      if (action === "cart-dec") {
        const id = Number(el.dataset.id);
        state.cart[id] = Math.max(0, (state.cart[id] || 0) - 1);
        if (state.cart[id] === 0) delete state.cart[id];
        render();
        return;
      }

      if (action === "cart-remove") {
        delete state.cart[Number(el.dataset.id)];
        render();
        return;
      }

      if (action === "edit-product") {
        const id = Number(el.dataset.id);
        const p = state.products.find(x => x.id === id);
        if (!p) return;
        state.editingProductId = id;
        state.productForm = { id: p.id, name: p.name, price: p.price, emoji: p.emoji, cat: p.cat };
        render();
        return;
      }

      if (action === "delete-product") {
        const id = Number(el.dataset.id);
        state.products = state.products.filter(x => x.id !== id);
        // remove from cart if present
        if (state.cart[id]) delete state.cart[id];
        flash("Produk dihapus.", "ok");
        render();
        return;
      }

      if (action === "cancel-edit-product") {
        state.editingProductId = null;
        state.productForm = { id: null, name: "", price: 0, emoji: "", cat: "" };
        render();
        return;
      }

      if (action === "pick-topup") {
        state.topupAmount = Number(el.dataset.amount);
        render();
        return;
      }

      if (action === "confirm-payment") {
        openPaymentPin();
        return;
      }

      if (action === "cancel-pin") {
        state.paymentPhase = "none";
        state.pinValue = "";
        state.pinError = "";
        render();
        return;
      }

      if (action === "pin-key") {
        const digit = el.dataset.digit;
        if (state.pinValue.length >= 6) return;
        state.pinValue += digit;
        state.pinError = "";
        render();
        return;
      }

      if (action === "pin-del") {
        state.pinValue = state.pinValue.slice(0, -1);
        state.pinError = "";
        render();
        return;
      }

      if (action === "pin-submit") {
        submitPinPayment();
        return;
      }

      if (action === "payment-success-done") {
        state.paymentPhase = "none";
        state.pinValue = "";
        state.pinError = "";
        state.paymentTotal = 0;
        state.activeTab = "home";
        state.notice = "Pembayaran berhasil.";
        state.noticeType = "ok";
        render();
        return;
      }

      if (action === "open-topup-pin") {
        openTopupPin();
        return;
      }

      if (action === "cancel-topup-pin") {
        state.topupPhase = "none";
        state.topupPinValue = "";
        state.topupPinError = "";
        render();
        return;
      }

      if (action === "topup-pin-key") {
        const digit = el.dataset.digit;
        if (state.topupPinValue.length >= 6) return;
        state.topupPinValue += digit;
        state.topupPinError = "";
        render();
        return;
      }

      if (action === "topup-pin-del") {
        state.topupPinValue = state.topupPinValue.slice(0, -1);
        state.topupPinError = "";
        render();
        return;
      }

      if (action === "topup-pin-submit") {
        submitTopupPin();
        return;
      }

      if (action === "topup-success-done") {
        state.topupPhase = "none";
        state.topupPinValue = "";
        state.topupPinError = "";
        state.topupAmount = 0;
        state.activeTab = "home";
        state.notice = "Top up berhasil.";
        state.noticeType = "ok";
        render();
        return;
      }

      if (action === "confirm-topup") {
        openTopupPin();
      }
    });

    // close cart dropdown when clicking outside
    window.addEventListener("click", (e) => {
      if (state.cartOpen && !e.target.closest('.cart-root')) {
        state.cartOpen = false;
        render();
      }
    });

    render();
  </script>
</body>
</html>
