<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMART Kasir</title>
  <style>
    :root {
      --bg: #fafaf6;
      --surface: #ffffff;
      --ink: #1b1d17;
      --ink2: #4a4c42;
      --muted: #8b8d80;
      --line: rgba(24, 26, 20, 0.08);
      --line-soft: rgba(24, 26, 20, 0.05);
      --mint: #57c9a3;
      --mint-tint: #e6f6ef;
      --gold: #e3a93f;
      --gold-tint: #fbf1de;
      --orange: #e07b3f;
      --orange-tint: #fcebdd;
      --ink-tint: #eeefe9;
      --danger: #c24d4d;
      --shadow: 0 24px 60px -36px rgba(24, 26, 20, 0.32);
      --radius: 28px;
      --radius-lg: 36px;
      --radius-md: 22px;
      --radius-sm: 16px;
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    input, select {
      outline: none;
    }
    .app-shell {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(87, 201, 163, 0.18), transparent 34%),
        radial-gradient(circle at bottom right, rgba(224, 123, 63, 0.16), transparent 30%),
        var(--bg);
    }
    .bg-orb {
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(110px);
      opacity: 0.55;
    }
    .orb-a { width: 420px; height: 420px; top: -130px; left: -140px; background: rgba(87, 201, 163, 0.28); }
    .orb-b { width: 380px; height: 380px; bottom: -150px; right: -90px; background: rgba(224, 123, 63, 0.22); }
    .root {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }
    .login-wrap,
    .main-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card-shell {
      width: 100%;
      max-width: 1180px;
      border-radius: 34px;
      overflow: hidden;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(24, 26, 20, 0.08);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }
    .login-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      min-height: 680px;
    }
    .hero {
      padding: 40px;
      background: linear-gradient(155deg, var(--mint-tint), var(--gold-tint));
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      box-shadow: 0 0 0 1px rgba(24, 26, 20, 0.08);
      flex: 0 0 auto;
    }
    .logo div:nth-child(1) { background: var(--mint); }
    .logo div:nth-child(2) { background: var(--gold); }
    .logo div:nth-child(3) { background: var(--orange); }
    .logo div:nth-child(4) { background: var(--ink); }
    h1, h2, h3, p { margin: 0; }
    .hero h1 {
      margin-top: 28px;
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }
    .hero p.lead {
      margin-top: 14px;
      max-width: 440px;
      color: var(--ink2);
      font-size: 15px;
      line-height: 1.6;
    }
    .hero-badges {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(24, 26, 20, 0.06);
      box-shadow: 0 12px 24px -18px rgba(24, 26, 20, 0.4);
      color: var(--ink);
      font-weight: 700;
      font-size: 13px;
    }
    .badge small { display: block; color: var(--muted); font-weight: 600; font-size: 11px; margin-top: 2px; }
    .login-form {
      padding: 44px 38px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      background: rgba(255,255,255,0.92);
    }
    .title {
      font-size: clamp(1.7rem, 2.6vw, 2.5rem);
      letter-spacing: -0.04em;
      line-height: 1.05;
    }
    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink2);
    }
    .input-shell, .select-shell {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-radius: 20px;
      background: var(--bg);
      border: 1.5px solid var(--line);
    }
    .input-shell input, .select-shell select {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
    }
    .input-icon {
      width: 18px;
      color: var(--muted);
      flex: 0 0 auto;
      text-align: center;
      font-size: 14px;
    }
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.16s ease, opacity 0.16s ease, box-shadow 0.16s ease;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.98); }
    .btn-dark { background: var(--ink); color: white; box-shadow: 0 16px 26px -18px rgba(27, 29, 23, 0.7); }
    .btn-mint { background: var(--mint); color: white; box-shadow: 0 16px 26px -18px rgba(87, 201, 163, 0.8); }
    .btn-orange { background: var(--orange); color: white; box-shadow: 0 16px 26px -18px rgba(224, 123, 63, 0.75); }
    .btn-ghost { background: transparent; color: var(--ink2); border: 1px solid var(--line); }
    .helper {
      margin-top: 8px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .sidebar {
      width: 280px;
      flex: 0 0 auto;
      background: rgba(255,255,255,0.85);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 20px;
      min-height: 100vh;
    }
    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 26px;
    }
    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 13px 14px;
      border-radius: 18px;
      color: var(--ink2);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .nav-btn.active {
      background: var(--ink);
      color: #fff;
    }
    .nav-pill {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.8;
      flex: 0 0 auto;
    }
    .main {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-scroll {
      flex: 1 1 auto;
      padding: 30px 24px 24px;
      overflow: auto;
    }
    .panel {
      background: rgba(255,255,255,0.82);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: 0 18px 40px -32px rgba(24, 26, 20, 0.24);
    }
    .page-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .home-hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
    }
    .hero-card {
      padding: 24px;
      border-radius: 28px;
      background: linear-gradient(155deg, rgba(87, 201, 163, 0.16), rgba(251, 241, 222, 0.92));
      position: relative;
      overflow: hidden;
      min-height: 180px;
    }
    .hero-card h2 {
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -0.04em;
      max-width: 470px;
    }
    .hero-card p {
      margin-top: 10px;
      max-width: 420px;
      color: var(--ink2);
      line-height: 1.6;
    }
    .hero-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 10px 14px;
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .stat-card {
      padding: 18px;
      border-radius: 24px;
      background: white;
      border: 1px solid var(--line);
    }
    .stat-value {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.04em;
      margin-top: 10px;
    }
    .stat-label {
      color: var(--ink2);
      font-size: 12px;
      margin-top: 4px;
      font-weight: 600;
    }
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .quick-card {
      padding: 18px;
      border-radius: 26px;
      min-height: 150px;
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .quick-card strong { font-size: 16px; line-height: 1.35; }
    .student-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .student-card {
      border-radius: 24px;
      padding: 16px;
      border: 1.5px solid var(--line);
      background: rgba(255,255,255,0.95);
      text-align: left;
    }
    .student-card.active {
      border-color: var(--mint);
      box-shadow: 0 12px 28px -20px rgba(87, 201, 163, 0.85);
    }
    .student-name {
      font-weight: 800;
      font-size: 15px;
    }
    .student-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    .two-col {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 18px;
      align-items: start;
    }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .product {
      padding: 16px;
      border-radius: 22px;
      background: white;
      border: 1px solid var(--line);
    }
    .product-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }
    .emoji-dot {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--bg);
      border: 1px solid var(--line);
      flex: 0 0 auto;
      font-size: 16px;
    }
    .product-name {
      font-weight: 800;
      font-size: 14px;
      margin-top: 12px;
    }
    .product-cat {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }
    .cart {
      padding: 18px;
      border-radius: 28px;
      background: white;
      border: 1px solid var(--line);
      position: sticky;
      top: 18px;
    }
    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .qty {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border-radius: 999px;
      padding: 4px;
      border: 1px solid var(--line);
    }
    .qty button {
      border: 0;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: white;
      color: var(--ink);
      font-weight: 900;
    }
    .cart-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-weight: 800;
    }
    .topup-grid {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 18px;
      align-items: start;
    }
    .topup-hero {
      padding: 22px;
      border-radius: 28px;
      background: linear-gradient(155deg, rgba(87, 201, 163, 0.16), rgba(251, 241, 222, 0.95));
    }
    .topup-value {
      margin-top: 16px;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: var(--mint);
    }
    .chip-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .chip {
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 18px;
      padding: 13px 12px;
      font-weight: 800;
      color: var(--ink2);
    }
    .chip.active {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .history-card {
      padding: 16px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: white;
    }
    .history-card.payment { background: linear-gradient(180deg, rgba(251, 241, 222, 0.92), white); }
    .history-card.topup { background: linear-gradient(180deg, rgba(230, 246, 239, 0.92), white); }
    .history-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 6px 10px;
      background: white;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 800;
    }
    .flash {
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: 18px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .flash.ok { background: rgba(87, 201, 163, 0.12); border-color: rgba(87, 201, 163, 0.25); color: #0f5b47; }
    .flash.err { background: rgba(194, 77, 77, 0.1); border-color: rgba(194, 77, 77, 0.24); color: var(--danger); }
    .bottom-nav {
      display: none;
      position: sticky;
      bottom: 0;
      padding: 14px 14px 18px;
      background: linear-gradient(180deg, transparent, rgba(250,250,246,0.98) 20%);
    }
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 999px;
      background: var(--ink);
    }
    .bottom-bar .nav-btn {
      color: rgba(255,255,255,0.56);
      justify-content: center;
      padding: 11px 12px;
      flex: 1 1 0;
    }
    .bottom-bar .nav-btn.active {
      color: white;
      background: rgba(255,255,255,0.14);
    }

    @media (max-width: 1024px) {
      .card-shell { border-radius: 28px; }
      .login-grid,
      .home-hero,
      .two-col,
      .topup-grid,
      .history-grid {
        grid-template-columns: 1fr;
      }
      .sidebar { display: none; }
      .main-scroll { padding: 18px 14px 10px; }
      .bottom-nav { display: block; }
      .student-row,
      .catalog-grid,
      .chip-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .quick-actions { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .login-wrap, .main-wrap { padding: 0; }
      .card-shell { border-radius: 0; min-height: 100vh; }
      .hero, .login-form { padding: 22px 18px; }
      .title { font-size: 30px; }
      .hero h1 { font-size: 28px; }
      .student-row,
      .catalog-grid,
      .chip-grid {
        grid-template-columns: 1fr;
      }
      .stat-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div id="root" class="root"></div>
  </div>

  <script>
    const state = {
      loggedIn: false,
      loginUsername: "",
      loginPassword: "",
      activeTab: "home",
      selectedStudentId: 1,
      cart: {},
      topupAmount: 0,
      notice: "",
      noticeType: "ok",
      students: [
        { id: 1, name: "Ahmad Fauzan", kelas: "VII A - Ibnu Sina", saldo: 85000 },
        { id: 2, name: "Siti Aisyah", kelas: "VIII A - Az-Zahra", saldo: 42500 },
        { id: 3, name: "Muhammad Rizki", kelas: "IX A - Al-Farabi", saldo: 128000 }
      ],
      products: [
        { id: 1, name: "Roti Coklat", price: 4000, emoji: "B" , cat: "Makanan" },
        { id: 2, name: "Nasi Uduk", price: 8000, emoji: "N", cat: "Makanan" },
        { id: 3, name: "Keripik Singkong", price: 3500, emoji: "K", cat: "Makanan" },
        { id: 4, name: "Donat Gula", price: 3000, emoji: "D", cat: "Makanan" },
        { id: 5, name: "Telur Gulung", price: 2500, emoji: "T", cat: "Makanan" },
        { id: 6, name: "Air Mineral", price: 3000, emoji: "A", cat: "Minuman" },
        { id: 7, name: "Teh Kotak", price: 4000, emoji: "T", cat: "Minuman" },
        { id: 8, name: "Susu Kotak", price: 5000, emoji: "S", cat: "Minuman" },
        { id: 9, name: "Es Cincau", price: 4500, emoji: "E", cat: "Minuman" },
        { id: 10, name: "Buku Tulis", price: 4500, emoji: "B", cat: "Alat Tulis" },
        { id: 11, name: "Pulpen", price: 2500, emoji: "P", cat: "Alat Tulis" },
        { id: 12, name: "Penghapus", price: 1500, emoji: "H", cat: "Alat Tulis" }
      ],
      chips: [10000, 20000, 50000, 100000, 200000],
      history: [
        { id: 1, type: "payment", name: "Ahmad Fauzan", amount: 12000, admin: "Admin", time: "08:12" },
        { id: 2, type: "topup", name: "Siti Aisyah", amount: 50000, admin: "Admin", time: "09:05" }
      ],
      stats: { transaksi: 12, topupTotal: 350000 }
    };

    const root = document.getElementById("root");

    const rupiah = (n) => "Rp" + Math.round(n).toLocaleString("id-ID");
    const esc = (v) => String(v).replace(/[&<>\"']/g, (m) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]));
    const selectedStudent = () => state.students.find((s) => s.id === state.selectedStudentId) || state.students[0];
    const cartItems = () => Object.entries(state.cart).map(([id, qty]) => {
      const p = state.products.find((x) => x.id === Number(id));
      return p ? { ...p, qty } : null;
    }).filter(Boolean);
    const cartTotal = () => cartItems().reduce((sum, item) => sum + item.price * item.qty, 0);

    function flash(message, type = "ok") {
      state.notice = message;
      state.noticeType = type;
      render();
      clearTimeout(flash._t);
      flash._t = setTimeout(() => {
        state.notice = "";
        render();
      }, 2200);
    }

    function pushHistory(entry) {
      state.history = [
        {
          id: Date.now(),
          time: new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }),
          admin: "Admin",
          ...entry
        },
        ...state.history
      ];
    }

    function loginView() {
      return `
        <div class="login-wrap">
          <div class="card-shell">
            <div class="login-grid">
              <section class="hero">
                <div class="brand">
                  <div class="logo" aria-hidden="true">
                    <div></div><div></div><div></div><div></div>
                  </div>
                  <div>SIMART</div>
                </div>
                <h1>Kelola SIMART<br/>Jadi Lebih Mudah</h1>
                <p class="lead">
                  Satu aplikasi kasir untuk pembayaran dan top up saldo santri, dirancang biar enak dibuka langsung dari file HTML.
                </p>
                <div class="hero-badges">
                  <div class="badge">PIN Terenkripsi <small>Transaksi aman</small></div>
                  <div class="badge">Real-time <small>Catat otomatis</small></div>
                </div>
              </section>
              <section class="login-form">
                <div>
                  <div class="title">Masuk ke aplikasi</div>
                  <p class="muted" style="margin-top:10px;">Gunakan demo login: <strong>admin</strong> / <strong>admin123</strong></p>
                </div>
                <form id="loginForm">
                  <div class="field" style="margin-bottom:14px;">
                    <label>Username</label>
                    <div class="input-shell">
                      <span class="input-icon">U</span>
                      <input name="username" autocomplete="username" placeholder="admin" />
                    </div>
                  </div>
                  <div class="field" style="margin-bottom:14px;">
                    <label>Kata sandi</label>
                    <div class="input-shell">
                      <span class="input-icon">P</span>
                      <input name="password" type="password" autocomplete="current-password" placeholder="admin123" />
                    </div>
                  </div>
                  <button class="btn btn-orange" type="submit" style="width:100%;">Masuk</button>
                </form>
              </section>
            </div>
          </div>
        </div>
      `;
    }

    function sidebar() {
      const tabs = [
        ["home", "Home"],
        ["payment", "Bayar"],
        ["topup", "Top Up"],
        ["history", "Riwayat"]
      ];
      return `
        <aside class="sidebar">
          <div>
            <div class="brand">
              <div class="logo" aria-hidden="true" style="width:38px;height:38px;border-radius:12px;">
                <div></div><div></div><div></div><div></div>
              </div>
              <div>SIMART</div>
            </div>
            <nav>
              ${tabs.map(([key, label]) => `
                <button class="nav-btn ${state.activeTab === key ? "active" : ""}" data-action="nav" data-tab="${key}">
                  <span class="nav-pill"></span>
                  <span>${label}</span>
                </button>
              `).join("")}
            </nav>
          </div>
          <div>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
              <div style="width:38px;height:38px;border-radius:999px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;">A</div>
              <div>
                <div style="font-weight:800;">Admin</div>
                <div style="font-size:12px;color:var(--muted);">Kasir SIMART</div>
              </div>
            </div>
            <button class="btn btn-ghost" style="width:100%;" data-action="logout">Keluar</button>
          </div>
        </aside>
      `;
    }

    function bottomNav() {
      const tabs = [
        ["home", "Home"],
        ["payment", "Bayar"],
        ["topup", "Top Up"],
        ["history", "Riwayat"]
      ];
      return `
        <div class="bottom-nav">
          <div class="bottom-bar">
            ${tabs.map(([key, label]) => `
              <button class="nav-btn ${state.activeTab === key ? "active" : ""}" data-action="nav" data-tab="${key}">
                <span>${label}</span>
              </button>
            `).join("")}
          </div>
        </div>
      `;
    }

    function homeView() {
      return `
        <div class="page-grid">
          ${state.notice ? `<div class="flash ${state.noticeType === "err" ? "err" : "ok"}">${esc(state.notice)}</div>` : ""}
          <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;">
            <div>
              <div class="muted">Selamat datang kembali</div>
              <h2 style="font-size:24px;letter-spacing:-0.04em;margin-top:4px;">Admin</h2>
            </div>
            <button class="btn btn-dark" data-action="nav" data-tab="payment">Mulai Bayar</button>
          </div>

          <div class="home-hero">
            <section class="hero-card">
              <h2>Kelola transaksi santri dengan cepat</h2>
              <p>Top up saldo, catat pembayaran, dan lihat riwayat transaksi dalam satu tampilan yang nyaman dipakai di laptop maupun tablet.</p>
              <div class="hero-chip">Top Up Sekarang</div>
            </section>
            <section class="stat-grid">
              <div class="stat-card">
                <div style="font-size:12px;color:var(--muted);font-weight:700;">Transaksi</div>
                <div class="stat-value">${state.stats.transaksi}</div>
                <div class="stat-label">Hari ini</div>
              </div>
              <div class="stat-card">
                <div style="font-size:12px;color:var(--muted);font-weight:700;">Top Up</div>
                <div class="stat-value">${rupiah(state.stats.topupTotal)}</div>
                <div class="stat-label">Total top up</div>
              </div>
            </section>
          </div>

          <div class="quick-actions">
            <button class="quick-card panel" data-action="nav" data-tab="payment">
              <strong>Pembayaran belanja santri</strong>
              <p class="muted">Pilih santri, tambah produk, lalu konfirmasi dengan PIN.</p>
            </button>
            <button class="quick-card panel" data-action="nav" data-tab="topup">
              <strong>Top up saldo cepat</strong>
              <p class="muted">Pilih nominal tetap atau isi nominal lain secara manual.</p>
            </button>
          </div>

          <div>
            <div class="section-title">Santri</div>
            <div class="student-row">
              ${state.students.map((s) => `
                <button class="student-card ${state.selectedStudentId === s.id ? "active" : ""}" data-action="select-student" data-id="${s.id}">
                  <div class="student-name">${esc(s.name)}</div>
                  <div class="student-sub">${esc(s.kelas)}</div>
                  <div style="margin-top:12px;font-weight:800;color:var(--ink);">${rupiah(s.saldo)}</div>
                </button>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function paymentView() {
      const student = selectedStudent();
      const total = cartTotal();
      const items = cartItems();
      return `
        <div class="page-grid">
          ${state.notice ? `<div class="flash ${state.noticeType === "err" ? "err" : "ok"}">${esc(state.notice)}</div>` : ""}
          <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;">
            <div>
              <div class="muted">Pembayaran</div>
              <h2 style="font-size:24px;letter-spacing:-0.04em;margin-top:4px;">Detail belanja</h2>
            </div>
            <button class="btn btn-ghost" data-action="nav" data-tab="home">Kembali</button>
          </div>

          <div class="field">
            <label>Santri</label>
            <div class="student-row">
              ${state.students.map((s) => `
                <button class="student-card ${state.selectedStudentId === s.id ? "active" : ""}" data-action="select-student" data-id="${s.id}">
                  <div class="student-name">${esc(s.name)}</div>
                  <div class="student-sub">${esc(s.kelas)}</div>
                  <div style="margin-top:12px;font-weight:800;color:var(--ink);">${rupiah(s.saldo)}</div>
                </button>
              `).join("")}
            </div>
          </div>

          <div class="two-col">
            <section class="panel" style="padding:18px;">
              <div class="section-title">Produk</div>
              <div class="catalog-grid">
                ${state.products.map((p) => `
                  <div class="product">
                    <div class="product-top">
                      <div>
                        <div class="emoji-dot">${p.emoji}</div>
                      </div>
                      <div class="pill">${rupiah(p.price)}</div>
                    </div>
                    <div class="product-name">${esc(p.name)}</div>
                    <div class="product-cat">${esc(p.cat)}</div>
                    <button class="btn btn-dark" style="width:100%;margin-top:14px;" data-action="add-product" data-id="${p.id}">Tambah</button>
                  </div>
                `).join("")}
              </div>
            </section>

            <aside class="cart">
              <div class="section-title">Keranjang</div>
              <div class="muted">${esc(student.name)} | Saldo: ${rupiah(student.saldo)}</div>
              ${items.length === 0 ? `<div style="padding:20px 0;color:var(--muted);">Keranjang masih kosong.</div>` : items.map((item) => `
                <div class="cart-row">
                  <div>
                    <div style="font-weight:800;">${esc(item.name)}</div>
                    <div class="muted">${item.qty} x ${rupiah(item.price)}</div>
                  </div>
                  <div style="text-align:right;">
                    <div style="font-weight:900;">${rupiah(item.qty * item.price)}</div>
                    <div class="qty" style="margin-top:8px;">
                      <button data-action="cart-dec" data-id="${item.id}">-</button>
                      <span style="min-width:18px;text-align:center;font-weight:800;">${item.qty}</span>
                      <button data-action="cart-inc" data-id="${item.id}">+</button>
                      <button data-action="cart-remove" data-id="${item.id}" style="margin-left:4px;background:var(--orange-tint);color:var(--orange);">x</button>
                    </div>
                  </div>
                </div>
              `).join("")}
              <div class="cart-total">
                <span>Total</span>
                <span>${rupiah(total)}</span>
              </div>
              <button class="btn btn-orange" data-action="confirm-payment" style="width:100%;margin-top:16px;" ${total <= 0 ? "disabled" : ""}>
                Konfirmasi Pembayaran
              </button>
              <div class="muted" style="margin-top:10px;">Demo PIN: 123456</div>
            </aside>
          </div>
        </div>
      `;
    }

    function topupView() {
      const student = selectedStudent();
      const amount = state.topupAmount || 0;
      return `
        <div class="page-grid">
          ${state.notice ? `<div class="flash ${state.noticeType === "err" ? "err" : "ok"}">${esc(state.notice)}</div>` : ""}
          <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;">
            <div>
              <div class="muted">Top Up</div>
              <h2 style="font-size:24px;letter-spacing:-0.04em;margin-top:4px;">Isi saldo santri</h2>
            </div>
            <button class="btn btn-ghost" data-action="nav" data-tab="home">Kembali</button>
          </div>

          <div class="topup-grid">
            <section class="topup-hero">
              <div class="section-title" style="margin-bottom:6px;">Santri dipilih</div>
              <div style="font-size:22px;font-weight:900;letter-spacing:-0.03em;">${esc(student.name)}</div>
              <div class="muted" style="margin-top:4px;">${esc(student.kelas)}</div>
              <div style="margin-top:18px;color:var(--ink2);font-size:12px;font-weight:700;">Saldo sekarang</div>
              <div class="topup-value">${rupiah(student.saldo)}</div>
              <div class="muted" style="margin-top:6px;">Nominal top up dipilih</div>
              <div style="margin-top:18px;" class="pill">${rupiah(amount)}</div>
            </section>

            <section class="panel" style="padding:18px;">
              <div class="section-title">Pilih nominal</div>
              <div class="chip-grid">
                ${state.chips.map((v) => `
                  <button class="chip ${state.topupAmount === v ? "active" : ""}" data-action="pick-topup" data-amount="${v}">${rupiah(v)}</button>
                `).join("")}
              </div>

              <div style="margin-top:16px;" class="field">
                <label>Atau nominal lain</label>
                <div class="input-shell">
                  <span class="input-icon">Rp</span>
                  <input id="customTopup" inputmode="numeric" placeholder="0" />
                </div>
              </div>

              <button class="btn btn-mint" data-action="confirm-topup" style="width:100%;margin-top:18px;">Top Up</button>
            </section>
          </div>
        </div>
      `;
    }

    function historyView() {
      return `
        <div class="page-grid">
          ${state.notice ? `<div class="flash ${state.noticeType === "err" ? "err" : "ok"}">${esc(state.notice)}</div>` : ""}
          <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;">
            <div>
              <div class="muted">Riwayat</div>
              <h2 style="font-size:24px;letter-spacing:-0.04em;margin-top:4px;">Transaksi terakhir</h2>
            </div>
            <button class="btn btn-ghost" data-action="nav" data-tab="home">Kembali</button>
          </div>

          <div class="history-grid">
            ${state.history.length === 0 ? `
              <div class="panel" style="padding:28px;text-align:center;color:var(--muted);grid-column:1/-1;">Belum ada transaksi hari ini.</div>
            ` : state.history.map((h) => `
              <div class="history-card ${h.type}">
                <div class="history-top">
                  <div>
                    <div class="pill" style="margin-bottom:12px;">${h.type === "topup" ? "Top Up" : "Pembayaran"}</div>
                    <div style="font-weight:900;font-size:16px;">${esc(h.name)}</div>
                    <div class="muted" style="margin-top:4px;">Kasir ${esc(h.admin)} | ${esc(h.time)}</div>
                  </div>
                  <div class="pill">${rupiah(h.amount)}</div>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function appView() {
      return `
        <div class="main-wrap">
          <div class="card-shell" style="display:flex;min-height:calc(100vh - 48px);">
            ${sidebar()}
            <main class="main">
              <div class="main-scroll">
                ${state.activeTab === "home" ? homeView() : ""}
                ${state.activeTab === "payment" ? paymentView() : ""}
                ${state.activeTab === "topup" ? topupView() : ""}
                ${state.activeTab === "history" ? historyView() : ""}
              </div>
              ${bottomNav()}
            </main>
          </div>
        </div>
      `;
    }

    function render() {
      root.innerHTML = state.loggedIn ? appView() : loginView();
    }

    root.addEventListener("submit", (e) => {
      if (e.target && e.target.id === "loginForm") {
        e.preventDefault();
        const fd = new FormData(e.target);
        const username = String(fd.get("username") || "").trim();
        const password = String(fd.get("password") || "");
        if (username === "admin" && password === "admin123") {
          state.loggedIn = true;
          state.activeTab = "home";
          state.selectedStudentId = 1;
          state.notice = "";
          render();
        } else {
          flash("Username atau kata sandi salah.", "err");
        }
      }
    });

    root.addEventListener("click", (e) => {
      const el = e.target.closest("[data-action]");
      if (!el) return;
      const action = el.dataset.action;

      if (action === "logout") {
        state.loggedIn = false;
        state.cart = {};
        state.topupAmount = 0;
        state.notice = "";
        render();
        return;
      }

      if (action === "nav") {
        state.activeTab = el.dataset.tab;
        state.notice = "";
        render();
        return;
      }

      if (action === "select-student") {
        state.selectedStudentId = Number(el.dataset.id);
        render();
        return;
      }

      if (action === "add-product") {
        const id = Number(el.dataset.id);
        state.cart[id] = (state.cart[id] || 0) + 1;
        render();
        return;
      }

      if (action === "cart-inc") {
        const id = Number(el.dataset.id);
        state.cart[id] = (state.cart[id] || 0) + 1;
        render();
        return;
      }

      if (action === "cart-dec") {
        const id = Number(el.dataset.id);
        state.cart[id] = Math.max(0, (state.cart[id] || 0) - 1);
        if (state.cart[id] === 0) delete state.cart[id];
        render();
        return;
      }

      if (action === "cart-remove") {
        delete state.cart[Number(el.dataset.id)];
        render();
        return;
      }

      if (action === "pick-topup") {
        state.topupAmount = Number(el.dataset.amount);
        render();
        return;
      }

      if (action === "confirm-payment") {
        const total = cartTotal();
        const student = selectedStudent();
        if (total <= 0) {
          flash("Keranjang masih kosong.", "err");
          return;
        }
        if (student.saldo < total) {
          flash("Saldo tidak mencukupi.", "err");
          return;
        }
        student.saldo -= total;
        state.stats.transaksi += 1;
        pushHistory({ type: "payment", name: student.name, amount: total });
        state.cart = {};
        state.activeTab = "history";
        flash("Pembayaran berhasil.", "ok");
        render();
        return;
      }

      if (action === "confirm-topup") {
        const custom = document.getElementById("customTopup");
        const customAmount = custom ? Number(String(custom.value || "").replace(/[^\d]/g, "")) : 0;
        const amount = state.topupAmount || customAmount;
        const student = selectedStudent();
        if (!amount || amount <= 0) {
          flash("Pilih nominal top up dulu.", "err");
          return;
        }
        student.saldo += amount;
        state.stats.topupTotal += amount;
        pushHistory({ type: "topup", name: student.name, amount });
        state.topupAmount = 0;
        state.activeTab = "history";
        flash("Top up berhasil.", "ok");
        render();
      }
    });

    render();
  </script>
</body>
</html>
