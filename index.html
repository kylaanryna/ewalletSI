<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMART Kasir</title>
  <link rel="icon" type="image/png" href="assets/simart-logo.png" /> 
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --bg: #fce9ab;
      --surface: #fff7dc;
      --ink: #7d1028;
      --ink2: #9e3146;
      --muted: #9f6a2b;
      --line: rgba(196, 43, 52, 0.18);
      --line-soft: rgba(252, 143, 45, 0.14);
      --mint: #9f9820;
      --mint-tint: #ece8b8;
      --gold: #fc8f2d;
      --gold-tint: #ffe1b6;
      --orange: #dc417c;
      --orange-tint: #f9c6d7;
      --ink-tint: #f5d6d9;
      --danger: #c42b34;
      --shadow: 0 24px 60px -36px rgba(120, 26, 41, 0.36);
      --blush: #dc417c;
      --tomato: #c42b34;
      --vanilla: #fce9ab;
      --princeton: #fc8f2d;
      --olive: #9f9820;
      --radius: 28px;
      --radius-lg: 36px;
      --radius-md: 22px;
      --radius-sm: 16px;
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    input, select {
      outline: none;
    }
    .app-shell {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(220, 65, 124, 0.28), transparent 34%),
        radial-gradient(circle at bottom right, rgba(159, 152, 32, 0.2), transparent 30%),
        var(--bg);
    }
    .bg-orb {
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(110px);
      opacity: 0.55;
    }
    .orb-a {
      width: 420px;
      height: 420px;
      top: -130px;
      left: -140px;
      background: rgba(220, 65, 124, 0.34);
      animation: floatOrb 18s ease-in-out infinite alternate;
    }
    .orb-b {
      width: 380px;
      height: 380px;
      bottom: -150px;
      right: -90px;
      background: rgba(159, 152, 32, 0.24);
      animation: floatOrb 20s ease-in-out infinite alternate-reverse;
    }
    @keyframes floatOrb {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(8px, -8px, 0) scale(1.02); }
    }
    .root {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }
    .login-wrap,
    .main-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card-shell {
      width: 100%;
      max-width: 1180px;
      border-radius: 34px;
      overflow: hidden;
      background: rgba(255, 247, 220, 0.82);
      border: 1px solid rgba(196, 43, 52, 0.14);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      animation: none;
    }
    .login-grid {
      display: grid;
      grid-template-columns: 1.14fr 0.86fr;
      min-height: 680px;
    }
    .hero {
      padding: 42px 44px 36px;
      background: linear-gradient(135deg, #d63d6a 0%, #c72c4f 24%, #d65d56 52%, #e9844a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      animation: none;
    }
    .hero::after {
      content: "";
      position: absolute;
      right: -70px;
      bottom: -90px;
      width: 320px;
      height: 320px;
      border-radius: 999px;
      background: rgba(255, 247, 220, 0.10);
      filter: blur(8px);
      pointer-events: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 20px;
      line-height: 1;
      letter-spacing: 0.04em;
      position: relative;
      z-index: 1;
    }
    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(24, 26, 20, 0.08);
      flex: 0 0 auto;
    }
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .profile-avatar {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      object-fit: contain;
      background: #fff;
      padding: 2px;
      box-sizing: border-box;
      box-shadow: 0 0 0 1px rgba(24, 26, 20, 0.08);
      display: block;
      flex: 0 0 auto;
    }
    h1, h2, h3, p { margin: 0; }
    .hero h1 {
      margin-top: 34px;
      font-size: clamp(2.4rem, 4vw, 4.1rem);
      line-height: 0.96;
      letter-spacing: -0.06em;
      position: relative;
      z-index: 1;
      max-width: 420px;
      color: #fffaf0;
    }
    .hero p.lead {
      margin-top: 18px;
      max-width: 460px;
      color: rgba(255, 247, 220, 0.9);
      font-size: 15px;
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }
    .hero-badges {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 247, 220, 0.14);
      border: 1px solid rgba(255, 247, 220, 0.20);
      box-shadow: 0 12px 24px -18px rgba(120, 26, 41, 0.45);
      color: #fff7dc;
      font-weight: 700;
      font-size: 13px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      backdrop-filter: blur(2px);
    }
    .badge:hover { transform: translateY(-1px); box-shadow: 0 14px 22px -20px rgba(24, 26, 20, 0.5); }
    .badge small { display: block; color: rgba(255, 247, 220, 0.78); font-weight: 600; font-size: 11px; margin-top: 2px; }
    .login-form {
      padding: 54px 56px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(180deg, #f8f2dd 0%, #f4ead1 100%);
    }
    .title {
      font-size: clamp(2.2rem, 3vw, 3rem);
      letter-spacing: -0.06em;
      line-height: 1.05;
      color: var(--ink);
      font-weight: 800;
    }
    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }
    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink2);
    }
    .input-shell, .select-shell {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 16px;
      border-radius: 18px;
      background: rgba(252, 233, 171, 0.42);
      border: 1.5px solid rgba(196, 43, 52, 0.12);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }
    .input-shell:focus-within {
      border-color: rgba(196, 43, 52, 0.26);
      box-shadow: 0 0 0 3px rgba(196, 43, 52, 0.07);
    }
    .input-shell input, .select-shell select {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
    }
    .input-icon {
      width: 18px;
      color: var(--muted);
      flex: 0 0 auto;
      text-align: center;
      font-size: 14px;
    }
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 15px 18px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.14s ease, opacity 0.14s ease, box-shadow 0.14s ease;
      text-decoration: none;
      white-space: nowrap;
      will-change: transform;
      font-size: 15px;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: scale(0.99) translateY(0); }
    .btn-dark { background: linear-gradient(135deg, #c94062, #b81e44); color: white; box-shadow: 0 16px 26px -18px rgba(196, 43, 52, 0.82); }
    .btn-mint { background: linear-gradient(135deg, #b9bd4f, #9b9b20); color: white; box-shadow: 0 16px 26px -18px rgba(159, 152, 32, 0.82); }
    .btn-orange { background: linear-gradient(135deg, #f7b15d, #ea8d39); color: white; box-shadow: 0 16px 26px -18px rgba(252, 143, 45, 0.82); }
    .btn-ghost { background: transparent; color: var(--ink2); border: 1px solid var(--line); }
    .helper {
      margin-top: 8px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .sidebar {
      width: 280px;
      flex: 0 0 auto;
      background: linear-gradient(180deg, #fff9e4 0%, #ffe8bd 100%);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 20px;
      min-height: 100vh;
    }
    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 26px;
    }
    .nav-btn {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 13px 14px;
      border-radius: 18px;
      color: var(--ink2);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .nav-btn.active {
      background: var(--tomato);
      color: #fff;
      box-shadow: 0 14px 24px -20px rgba(196, 43, 52, 0.72);
    }
    .nav-btn {
      transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }
    .nav-btn:hover {
      transform: translateX(3px);
    }
    .nav-pill {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.8;
      flex: 0 0 auto;
    }
    .main {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main-scroll {
      flex: 1 1 auto;
      padding: 30px 24px 24px;
      overflow: auto;
    }
    .panel {
      background: rgba(255, 250, 236, 0.84);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: 0 18px 40px -32px rgba(120, 26, 41, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      animation: none;
    }
    .panel:hover,
    .quick-card:hover,
    .student-card:hover,
    .product:hover,
    .history-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 28px -22px rgba(24, 26, 20, 0.28);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .page-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .scan-panel {
      padding: clamp(20px, 2.6vw, 34px);
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, #fffaf0 0%, #fff1d4 100%);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .scan-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(47, 158, 99, 0.12);
      border: 1px solid rgba(47, 158, 99, 0.28);
      color: #22744b;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .status-pill .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2f9e63;
      box-shadow: 0 0 0 3px rgba(47, 158, 99, 0.18);
      animation: ledBlink 1.8s ease-in-out infinite;
    }
    .status-pill.fail {
      background: rgba(196, 43, 52, 0.09);
      border-color: rgba(196, 43, 52, 0.3);
      color: var(--danger);
    }
    .status-pill.fail .status-dot {
      background: var(--danger);
      box-shadow: 0 0 0 3px rgba(196, 43, 52, 0.16);
    }
    @keyframes ledBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.96); }
    }
    .scan-title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(1.5rem, 2vw, 2rem);
      letter-spacing: -0.04em;
      line-height: 1.15;
      font-weight: 800;
    }
    .scan-subtitle {
      margin: 8px 0 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.65;
    }
    .scan-stage {
      position: relative;
      margin-top: 20px;
      display: grid;
      place-items: center;
      gap: 14px;
      padding: clamp(24px, 3.4vw, 40px) 20px;
      border-radius: var(--radius-md);
      background:
        radial-gradient(circle at 18% 12%, rgba(252, 143, 45, 0.16), transparent 46%),
        radial-gradient(circle at 84% 88%, rgba(220, 65, 124, 0.14), transparent 46%),
        linear-gradient(160deg, #ffeccd 0%, #ffe3f0 100%);
      border: 2px dashed rgba(196, 43, 52, 0.26);
      overflow: hidden;
      transition: border-color 0.25s ease;
    }
    .scan-stage.is-fail {
      border-color: rgba(196, 43, 52, 0.45);
      background:
        radial-gradient(circle at 18% 12%, rgba(196, 43, 52, 0.1), transparent 46%),
        radial-gradient(circle at 84% 88%, rgba(196, 43, 52, 0.12), transparent 46%),
        linear-gradient(160deg, #ffe4e2 0%, #ffd6dc 100%);
    }
    .stage-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120px;
      height: 120px;
      margin: -60px 0 0 -60px;
      border-radius: 999px;
      border: 2px solid rgba(199, 44, 79, 0.35);
      opacity: 0;
      pointer-events: none;
    }
    .scan-stage.is-scanning .stage-ring {
      animation: ringOut 1.6s ease-out infinite;
    }
    .scan-stage.is-scanning .stage-ring.r2 {
      animation-delay: 0.8s;
    }
    @keyframes ringOut {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    @keyframes stageSweep {
      0% { transform: translateY(-70px); }
      50% { transform: translateY(70px); }
      100% { transform: translateY(-70px); }
    }
    .scan-card-art {
      position: relative;
      z-index: 1;
      width: min(300px, 78%);
      aspect-ratio: 1.586;
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(135deg, #d63d6a 0%, #c72c4f 45%, #e9844a 100%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 24px 40px -26px rgba(125, 16, 40, 0.55);
      color: #fff7dc;
      transition: transform 0.25s ease;
    }
    .scan-stage.is-scanning .scan-card-art {
      animation: cardFloat 1.6s ease-in-out infinite;
    }
    .scan-stage.is-fail .scan-card-art {
      filter: saturate(0.75);
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .art-chip {
      width: 38px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #ffe1b6, #fc8f2d);
      box-shadow: inset 0 0 0 1px rgba(125, 16, 40, 0.28);
    }
    .art-waves {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }
    .art-waves i {
      width: 5px;
      border-radius: 999px;
      background: rgba(255, 247, 220, 0.85);
    }
    .art-waves i:nth-child(1) { height: 10px; opacity: 0.5; }
    .art-waves i:nth-child(2) { height: 16px; opacity: 0.75; }
    .art-waves i:nth-child(3) { height: 22px; }
    .art-num {
      position: absolute;
      left: 18px;
      bottom: 15px;
      font-weight: 800;
      letter-spacing: 0.22em;
      font-size: 0.92rem;
    }
    .stage-line {
      position: absolute;
      z-index: 2;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(199, 44, 79, 0.55), transparent);
      opacity: 0;
      pointer-events: none;
    }
    .scan-stage.is-scanning .stage-line {
      opacity: 1;
      animation: stageSweep 1.4s ease-in-out infinite;
    }
    .stage-hint {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--ink2);
      background: rgba(255, 250, 236, 0.72);
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(196, 43, 52, 0.14);
      backdrop-filter: blur(2px);
    }
    .scan-stage.is-fail .stage-hint {
      color: var(--danger);
      border-color: rgba(196, 43, 52, 0.3);
    }
    .scan-form {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }
    .field-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink2);
    }
    .rfid-reader {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 8px 14px;
      border-radius: 999px;
      border: 2px solid var(--line);
      background: #fffbf1;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .rfid-reader:focus-within {
      border-color: rgba(199, 44, 79, 0.55);
      box-shadow: 0 0 0 4px rgba(199, 44, 79, 0.1);
    }
    .rfid-reader.is-scanning {
      border-color: rgba(252, 143, 45, 0.65);
      box-shadow: 0 0 0 4px rgba(252, 143, 45, 0.14);
    }
    .scan-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(220, 65, 124, 0.1);
      color: #c72c4f;
      font-weight: 800;
      font-size: 0.95rem;
      flex: 0 0 auto;
      box-shadow: inset 0 0 0 1px rgba(199, 44, 79, 0.22);
    }
    .rfid-reader.is-scanning .scan-icon {
      animation: scanPulse 1s ease-in-out infinite;
    }
    .rfid-reader input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 10px 6px;
    }
    .rfid-reader input::placeholder {
      color: rgba(159, 106, 43, 0.55);
      font-weight: 500;
    }
    @keyframes scanPulse {
      0% { transform: scale(1); box-shadow: inset 0 0 0 1px rgba(199,44,79,.22), 0 0 0 0 rgba(199, 44, 79, 0.3); }
      70% { transform: scale(1.06); box-shadow: inset 0 0 0 1px rgba(199,44,79,.22), 0 0 0 10px rgba(199, 44, 79, 0); }
      100% { transform: scale(1); box-shadow: inset 0 0 0 1px rgba(199,44,79,.22), 0 0 0 0 rgba(199, 44, 79, 0); }
    }
    .scan-actions {
      margin-top: 6px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: stretch;
    }
    .scan-actions .btn {
      flex: 1;
    }
    .scan-note {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
    }
    .demo-chip {
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(159, 152, 32, 0.12);
      border: 1px solid rgba(159, 152, 32, 0.3);
      color: #6f6c14;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .selected-student-box {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      background: rgba(47, 158, 99, 0.1);
      border: 1px solid rgba(47, 158, 99, 0.28);
      color: var(--ink);
    }
    .selected-student-box .student-box-label {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #22744b;
    }
    .selected-student-box strong {
      font-size: 1rem;
    }
    .product-panel {
      padding: 20px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 249, 240, 0.98), rgba(255, 247, 220, 0.95));
      border: 1px solid rgba(196, 43, 52, 0.12);
      box-shadow: 0 12px 28px -18px rgba(97, 44, 31, 0.28);
    }
    .product-panel .section-title {
      margin: 0 0 16px;
      font-size: clamp(1.3rem, 1.6vw, 1.8rem);
      letter-spacing: -0.04em;
      line-height: 1.1;
      color: var(--ink);

    function flyToCart(startRect, emoji) {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const target = document.querySelector(".cart-fab");
      let endX = window.innerWidth - 110;
      let endY = 58;
      if (target) {
        const r = target.getBoundingClientRect();
        endX = r.left + r.width / 2;
        endY = r.top + r.height / 2;
      }
      const sx = startRect ? startRect.left + startRect.width / 2 : endX;
      const sy = startRect ? startRect.top + startRect.height / 2 : endY;

      const flyer = document.createElement("div");
      flyer.className = "fly-to-cart";
      flyer.textContent = emoji || "🛍️";
      document.body.appendChild(flyer);

      const cx = (sx + endX) / 2;
      const cy = Math.min(sy, endY) - 130;
      const duration = 720;
      const t0 = performance.now();

      function step(now) {
        const t = Math.min((now - t0) / duration, 1);
        const inv = 1 - t;
        const x = inv * inv * sx + 2 * inv * t * cx + t * t * endX;
        const y = inv * inv * sy + 2 * inv * t * cy + t * t * endY;
        const scale = Math.max(1 - 0.55 * t, 0.3);
        flyer.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${scale}) rotate(${t * 30}deg)`;
        flyer.style.opacity = t > 0.85 ? String((1 - t) / 0.15) : "1";
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          flyer.remove();
          const cart = document.querySelector(".cart-fab");
          if (cart) {
            cart.classList.remove("cart-bump");
            void cart.offsetWidth;
            cart.classList.add("cart-bump");
          }
        }
      }
      requestAnimationFrame(step);
    }

    async function processRfidScan(cardId) {
      const normalized = String(cardId || "").trim();
      if (!normalized) {
        flash("Silakan tempel atau masukkan ID kartu santri terlebih dahulu.", "err");
        return;
      }

      try {
        state.scanAnimating = true;
        state.rfidInput = "Scanning...";
        render();

        const response = await fetch(`${API_BASE}/api/scan`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cardId: normalized })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.message || "Kartu tidak valid");
        }

        const student = result.data;
        state.selectedStudentId = student.id;
        state.rfidScanned = true;
        state.rfidInput = "";
        state.activeTab = "payment";
        state.scanAnimating = false;
        showSweetAlert(`Santri terdeteksi: ${student.name}`, "success", "Scan berhasil");
        render();
      } catch (error) {
        state.scanAnimating = false;
        state.rfidInput = "";
        showSweetAlert(error.message || "Gagal membaca kartu RFID.", "error", "Scan gagal");
      }
    }

    let lastHandledScanId = 0;
    let scanPollTimer = null;

    async function pollLastScan() {
      if (!state.loggedIn || state.activeTab !== "scan" || state.scanAnimating) return;

      try {
        const response = await fetch(`${API_BASE}/api/last-scan`);
        const result = await response.json();

        if (!result.ok || !result.data) return;

        const scan = result.data;

        if (scan.scanId && scan.scanId !== lastHandledScanId) {
          lastHandledScanId = scan.scanId;

          if (scan.ok && scan.data) {
            state.selectedStudentId = scan.data.id;
            state.rfidScanned = true;
            state.rfidInput = "";
            state.activeTab = "payment";
            render();
            showSweetAlert(`Santri terdeteksi: ${scan.data.name}`, "success", "Scan berhasil");
          } else {
            flash(scan.message || "Kartu tidak dikenali.", "err");
          }
        }
      } catch (error) {
      }
    }

    function startScanPolling() {
      if (scanPollTimer) return;
      scanPollTimer = setInterval(pollLastScan, 1500);
    }

    function stopScanPolling() {
      if (scanPollTimer) {
        clearInterval(scanPollTimer);
        scanPollTimer = null;

                  </div>
                </div>
              `}
            </div>
          </div>
        `;
      }

      return `
        <div class="page-grid">
          <div class="catalog-card">
            <div class="cart-head">
              <div>
                <div class="muted">Riwayat</div>
                <h2 class="cart-title">📋 Log Transaksi</h2>
              </div>
              <button class="btn btn-ghost" data-action="nav" data-tab="home">Kembali</button>
            </div>

            ${state.history.length === 0 ? `
              <div class="cart-empty">
                <div class="big">📋</div>
                <h3>Belum ada riwayat</h3>
                <p class="muted" style="margin:0 auto;max-width:360px;line-height:1.6;">Transaksi atau top up yang berhasil akan muncul di sini.</p>
              </div>
            ` : `
              <div class="history-grid" style="margin-top:16px;">
                ${state.history.map((h, i) => `
                  <button class="history-card ${h.type}" data-action="history-detail" data-id="${h.id}" style="animation-delay:${(i + 1) * 0.05}s;">
                    <div class="history-top">
                      <div class="pill">${h.type === "topup" ? "Top Up" : "Bayar"}</div>
                      <div class="muted" style="font-size:11px;text-align:right;">${esc(h.date || "")}<br/>${esc(h.time)}</div>
                    </div>
                    <div style="font-weight:800;font-size:15px;margin-top:10px;">${esc(h.name)}</div>
                    <div style="font-weight:900;font-size:1.1rem;margin-top:6px;color:var(--tomato);">${rupiah(h.amount)}</div>
                    <div class="muted" style="font-size:11px;margin-top:6px;">
                      ${h.type === "topup" ? "Isi saldo" : `${(h.items || []).reduce((s, it) => s + it.qty, 0)} item`} • oleh ${esc(h.admin)}
                    </div>
                  </button>
                `).join("")}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function render() {
      if (!state.loggedIn) {
        root.innerHTML = loginView();
        stopScanPolling();
        return;
      }

      const isMobile = window.innerWidth <= 1024;
      let content = "";
      if (state.activeTab === "home") content = homeView();
      else if (state.activeTab === "scan") content = scanView();
      else if (state.activeTab === "payment") content = paymentView();
      else if (state.activeTab === "topup") content = topupView();
      else if (state.activeTab === "products") content = productsView();
      else if (state.activeTab === "history") content = historyView();
      else if (state.activeTab === "cart") content = cartView();

      root.innerHTML = `
        <div style="display:flex;min-height:100vh;">
          ${!isMobile ? sidebar() : ""}
          <main class="main">
            <div class="main-scroll">
              ${content}
            </div>
            ${cartWidget()}
            ${isMobile ? bottomNav() : ""}
          </main>
        </div>
      `;

      if (state.activeTab === "scan") {
        startScanPolling();
      } else {
        stopScanPolling();
      }

      applyCatalogFilter("paymentLists");
      applyCatalogFilter("productLists");

      if (state.paymentPhase === "pin") syncPinInput("paymentPinInput", state.pinValue);
      else if (state.topupPhase === "pin") syncPinInput("topupPinInput", state.topupPinValue);
    }

    document.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (e.target.id === "loginForm") {
        const data = new FormData(e.target);
        const user = data.get("username");
        const pass = data.get("password");
        if (user === "admin" && pass === "admin123") {
          state.loggedIn = true;
          state.loginUsername = user;
          flash("Berhasil masuk sebagai admin.", "ok");
          await loadStudentsFromApi();
          render();
        } else {
          flash("Username atau kata sandi salah.", "err");
        }
      } else if (e.target.id === "rfidForm") {
        const input = document.getElementById("rfidInput");
        const val = input ? input.value : "";
        processRfidScan(val);
      } else if (e.target.id === "productForm") {
        const fd = new FormData(e.target);
        const emoji = fd.get("pemoji");
        const name = String(fd.get("pname") || "").trim();
        let cat = catKey(fd.get("pcat")) || "makanan";
        if (!CATEGORIES.some(c => c.key === cat)) cat = "makanan";
        const price = Number(String(fd.get("pprice") || "").replace(/[^0-9]/g, "")) || 0;

        if (!name || price <= 0) {
          flash("Nama dan harga produk wajib diisi.", "err");
          return;
        }

        if (state.editingProductId) {
          const p = state.products.find(x => x.id === state.editingProductId);
          if (p) {
            p.name = name;
            p.price = price;
            p.emoji = emoji || "📦";
            p.cat = cat;
          }
          state.editingProductId = null;
          flash("Produk berhasil diperbarui.", "ok");
        } else {
          const newId = state.products.length ? Math.max(...state.products.map(p => p.id)) + 1 : 1;
          state.products.push({
            id: newId,
            name,
            price,
            emoji: emoji || "📦",
            cat: cat
          });
          flash("Produk baru berhasil ditambahkan.", "ok");
        }
        state.productForm = { id: null, name: "", price: 0, emoji: "", cat: "" };
        state.productSearch = "";
        state.productCat = "all";
        render();
      }
    });

    document.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;

      if (action === "nav") {
        state.activeTab = btn.dataset.tab;
        if (btn.dataset.tab === "history") state.historyDetailId = null;
        state.paymentPhase = "none";
        state.pinValue = "";
        state.pinError = "";
        state.topupPhase = "none";
        state.topupPinValue = "";
        state.topupPinError = "";
        render();
      } else if (action === "logout") {
        state.loggedIn = false;
        state.paymentPhase = "none";
        state.topupPhase = "none";
        stopScanPolling();
        render();
      } else if (action === "select-student") {
        state.selectedStudentId = Number(btn.dataset.id);
        render();
      } else if (action === "add-product") {
        const id = Number(btn.dataset.id);
        state.cart[id] = (state.cart[id] || 0) + 1;
        const rect = btn.getBoundingClientRect();
        const p = state.products.find(x => x.id === id);
        flyToCart(rect, p ? p.emoji : "🛍️");
        render();
      } else if (action === "cart-inc") {
        const id = Number(btn.dataset.id);
        state.cart[id] = (state.cart[id] || 0) + 1;
        render();
      } else if (action === "cart-dec") {
        const id = Number(btn.dataset.id);
        if (state.cart[id] > 1) {
          state.cart[id] -= 1;
        } else {
          delete state.cart[id];
        }
        render();
      } else if (action === "proceed-payment") {
        state.activeTab = "cart";
        render();
      } else if (action === "open-payment-pin") {
        openPaymentPin();
      } else if (action === "cancel-payment") {
        state.paymentPhase = "none";
        state.pinValue = "";
        state.pinError = "";
        render();
      } else if (action === "pin-key") {
        if (state.pinValue.length < 6) {
          state.pinValue += btn.dataset.val;
          render();
        }
      } else if (action === "pin-del") {
        state.pinValue = state.pinValue.slice(0, -1);
        render();
      } else if (action === "pin-ok") {
        submitPinPayment();
      } else if (action === "select-chip") {
        state.topupAmount = Number(btn.dataset.val);
        render();
      } else if (action === "proceed-topup") {
        openTopupPin();
      } else if (action === "cancel-topup-pin") {
        state.topupPhase = "none";
        state.topupPinValue = "";
        state.topupPinError = "";
        render();
      } else if (action === "topup-pin-key") {
        if (state.topupPinValue.length < 6) {
          state.topupPinValue += btn.dataset.val;
          render();
        }
      } else if (action === "topup-pin-del") {
        state.topupPinValue = state.topupPinValue.slice(0, -1);
        render();
      } else if (action === "topup-pin-ok") {
        submitTopupPin();
      } else if (action === "edit-product") {
        const id = Number(btn.dataset.id);
        const p = state.products.find(x => x.id === id);
        if (p) {
          state.editingProductId = id;
          state.productForm = { ...p };
          render();
        }
      } else if (action === "cancel-edit-product") {
        state.editingProductId = null;
        state.productForm = { id: null, name: "", price: 0, emoji: "", cat: "" };
        render();
      } else if (action === "delete-product") {
        const id = Number(btn.dataset.id);
        state.products = state.products.filter(x => x.id !== id);
        delete state.cart[id];
        flash("Produk berhasil dihapus.", "ok");
        render();
      } else if (action === "history-detail") {
        state.historyDetailId = Number(btn.dataset.id);
        render();
      } else if (action === "close-history-detail") {
        state.historyDetailId = null;
        render();
      }
    });

    document.addEventListener("click", (e) => {
      const chip = e.target.closest("[data-cat-filter]");
      if (!chip) return;
      const scope = chip.dataset.scope;
      const cat = chip.dataset.catFilter;
      if (scope === "product") state.productCat = cat;
      else state.paymentCat = cat;
      const listId = scope === "product" ? "productLists" : "paymentLists";
      document.querySelectorAll(`[data-cat-filter][data-scope="${scope}"]`).forEach(c => c.classList.toggle("active", c === chip));
      applyCatalogFilter(listId);
    });

    document.addEventListener("input", (e) => {
      const t = e.target;
      if (!t) return;
      if (t.id === "paymentPinInput" || t.id === "topupPinInput") {
        const digits = String(t.value || "").replace(/\D/g, "").slice(0, 6);
        if (t.id === "paymentPinInput") {
          state.pinValue = digits;
          state.pinError = "";
        } else {
          state.topupPinValue = digits;
          state.topupPinError = "";
        }
        render();
        return;
      }
      if (t.id === "paymentSearch") {
        state.paymentSearch = t.value;
        applyCatalogFilter("paymentLists");
      } else if (t.id === "productSearch") {
        state.productSearch = t.value;
        applyCatalogFilter("productLists");
      } else if (t.name === "pemoji") {
        const prev = document.getElementById("productEmojiPreview");
        if (prev) prev.textContent = t.value || "📦";
      }
    });

    document.addEventListener("keydown", (e) => {
      if (!state.loggedIn) return;

      const t = e.target;
      const tag = t ? t.tagName : "";
      const inTextField = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
      const pinActive = state.paymentPhase === "pin" || state.topupPhase === "pin";

      if (e.key === "Enter") {
        if (state.paymentPhase === "pin") {
          e.preventDefault();
          submitPinPayment();
        } else if (state.topupPhase === "pin") {
          e.preventDefault();
          submitTopupPin();
        }
        return;
      }

      if (e.key === "Escape") {
        if (state.paymentPhase === "pin") {
          state.paymentPhase = "none";
          state.pinValue = "";
          state.pinError = "";
          render();
        } else if (state.topupPhase === "pin") {
          state.topupPhase = "none";
          state.topupPinValue = "";
          state.topupPinError = "";
          render();
        }
        return;
      }

      // Dukungan keyboard fisik: tangani angka & hapus walau fokus di luar input PIN
      if (pinActive && !(inTextField && t.id !== "paymentPinInput" && t.id !== "topupPinInput")) {
        const isPayment = state.paymentPhase === "pin";
        const current = isPayment ? state.pinValue : state.topupPinValue;
        if (/^[0-9]$/.test(e.key)) {
          if (current.length < 6) {
            e.preventDefault();
            if (isPayment) {
              state.pinValue = current + e.key;
              state.pinError = "";
            } else {
              state.topupPinValue = current + e.key;
              state.topupPinError = "";
            }
            render();
          }
          return;
        }
        if (e.key === "Backspace") {
          e.preventDefault();
          if (isPayment) {
            state.pinValue = current.slice(0, -1);
            state.pinError = "";
          } else {
            state.topupPinValue = current.slice(0, -1);
            state.topupPinError = "";
          }
          render();
        }
      }
    });

    document.addEventListener("click", (e) => {
      if (state.paymentPhase === "pin" && e.target && e.target.closest && e.target.closest("#paymentPinDisplay")) {
        const el = document.getElementById("paymentPinInput");
        if (el) el.focus();
      }
      if (state.topupPhase === "pin" && e.target && e.target.closest && e.target.closest("#topupPinDisplay")) {
        const el = document.getElementById("topupPinInput");
        if (el) el.focus();
      }
    });

    render();
  </script>
</body>
</html>
